<!DOCTYPE html>

<head>

<title>Q Option</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#f5f7f8;
    --card:#ffffff;

    --secondary:#707b80;

body.turquoise{

    --secondary:#6d858a;

    --buttonText:#ffffff;
    --header:#cfeef1;
}

body.mint{
    --bg:#f2faf6;
    --card:#ffffff;
    --text:#20332a;
    --secondary:#71847a;
    --border:#d9ebe1;
    --button:#39976c;
    --buttonText:#ffffff;
    --header:#d9eee3;
}

body.pink{
    --bg:#fff5f8;
    --card:#ffffff;
    --text:#39252c;
    --secondary:#8d7680;
    --border:#efdce4;
    --button:#d66f94;
    --buttonText:#ffffff;
    --header:#f6dce6;
}

body.lavender{
    --bg:#f8f5fc;
    --card:#ffffff;
    --text:#30283a;
    --secondary:#80758d;
    --border:#e6deef;
    --button:#8964b5;
    --buttonText:#ffffff;

}

body.silver{
    --bg:#f3f5f6;
    --card:#ffffff;
    --text:#292d31;
    --secondary:#737b81;
    --border:#dde1e4;
    --button:#69737b;
    --buttonText:#ffffff;
    --header:#e2e6e8;
}

body.midnight{
    --bg:#090c11;
    --card:#151a22;
    --text:#f3f5f7;
    --secondary:#9da5ae;
    --border:#292f39;

}

body.navy{
    --bg:#07111f;
    --card:#0e1b2d;
    --text:#edf6ff;
    --secondary:#8da3b8;
    --border:#1b3450;

}

body.emerald{
    --bg:#06150f;
    --card:#0d2118;

body.darkpurple{

*{
    box-sizing:border-box;
}

body{
    font-family:"Tajawal",Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    margin:0;
    padding:20px;
}

.container{
    max-width:1150px;
    margin:auto;
}

.logo{
    width:150px;
    height:150px;
    object-fit:contain;
    display:block;
    margin:0 auto 5px;
}

h1{
    font-family:"Cairo",Arial,sans-serif;
    font-size:32px;
    font-weight:800;
    text-align:center;
    margin:0 0 20px;
}

button{
    font-family:"Tajawal",Arial,sans-serif;
}

.theme-button,
.report-button{
    display:block;
    margin:0 auto 12px;
    padding:12px 22px;
    background:var(--button);
    color:var(--buttonText);
    border:none;
    border-radius:11px;
    cursor:pointer;

}

.theme-menu{
    display:none;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:15px;
    margin-bottom:20px;
    gap:10px;
}

.theme-menu.show{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
}

.theme-menu button{
    padding:12px;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--card);
    color:var(--text);
    cursor:pointer;
}

.form-box{
    background:var(--card);
    padding:20px;
    border-radius:16px;
    border:1px solid var(--border);
    box-shadow:0 4px 18px #00000012;
}

.form{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:11px;
}

.field{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.field label{
    font-size:13px;
    font-weight:700;
    color:var(--secondary);
}

input,
select{
    width:100%;
    padding:12px;
    border:1px solid var(--border);
    border-radius:9px;
    font-family:"Tajawal",Arial,sans-serif;
    font-size:15px;
    background:var(--card);
    color:var(--text);
}

.add-button{
    margin-top:16px;
    width:100%;
    padding:14px;
    background:var(--button);
    color:var(--buttonText);
    border:none;
    border-radius:10px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
}

.table-box{
    margin-top:20px;
    background:var(--card);
    padding:15px;
    border-radius:16px;
    border:1px solid var(--border);
    overflow-x:auto;
}

table{
    width:100%;
    min-width:1050px;
    border-collapse:collapse;
}

th{
    background:var(--header);
    color:var(--text);
    padding:13px;
    font-family:"Cairo",Arial,sans-serif;
    font-weight:700;
}

td{
    padding:12px;
    text-align:center;
    border-bottom:1px solid var(--border);
}

.green{
    color:#13894e;
    font-weight:700;
}

.orange{
    color:#00879c;
    font-weight:700;
}

.red{
    color:#d62f2f;
    font-weight:700;
}

.delete-button{
    background:#d93636;
    color:white;
    border:none;
    border-radius:7px;
    padding:7px 12px;
    cursor:pointer;
}

.empty{
    text-align:center;
    color:var(--secondary);
    padding:25px;
}

.report-filter{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px;
    margin-top:20px;
}

.report-filter h3{
    font-family:"Cairo",Arial,sans-serif;
    text-align:center;
    margin-top:0;
}

.filter-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:10px;
}

.filter-button{
    padding:11px;
    border:none;
    border-radius:9px;
    background:var(--header);
    color:var(--text);
    cursor:pointer;
    font-weight:700;
}

.filter-button.active{
    background:var(--button);
    color:var(--buttonText);
}

.report{
    display:none;
    background:#ffffff !important;
    color:#222222 !important;
    border:1px solid #dddddd;
    border-radius:16px;
    padding:20px;
    margin-top:20px;
}

.report.show{
    display:block;
}

.report h2{
    font-family:"Cairo",Arial,sans-serif;
    text-align:center;
    color:#222222 !important;
    margin:20px 0 8px;
}

.report-period{
    text-align:center;
    color:#666666 !important;
    font-size:15px;
    margin-bottom:20px;
}

.report-banner{
    width:100%;
    height:150px;
    background:#000000;
    display:flex;
    justify-content:center;
    align-items:center;
    border-radius:12px;
    overflow:hidden;
}

.report-banner img{
    width:140px;
    height:140px;
    object-fit:contain;
}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:10px;
    margin:20px 0;
}

.stat{
    background:#f4f4f4 !important;
    color:#222222 !important;
    padding:15px;
    border-radius:11px;
    text-align:center;
}

.stat strong{
    display:block;
    font-size:21px;
    margin-top:7px;
}

.report-table{
    background:#ffffff !important;
    color:#222222 !important;
    overflow-x:auto;
}

.report-table table{
    width:100%;
    min-width:1050px;
    border-collapse:collapse;
    background:#ffffff !important;
}

.report-table th{
    background:#d9eef0 !important;
    color:#17363a !important;
    border:1px solid #b9d9dc;
    padding:13px;
}

.report-table td{
    border:1px solid #d5d5d5;
    padding:11px;
    color:#222222 !important;
}

.report-table tr.win-row td{
    background:#dff5e7 !important;
    color:#126b3d !important;
}

.report-table tr.stopped-row td{
    background:#dff7fb !important;
    color:#00788c !important;
}

.report-table tr.loss-row td{
    background:#ffe1e1 !important;
    color:#b52222 !important;
}

.report-actions{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.report-action{
    background:#222222;
    color:#ffffff;
    border:none;
    border-radius:9px;
    padding:12px 18px;
    cursor:pointer;
    font-size:15px;
    font-weight:700;
}

@media print{

    body{
        background:#ffffff !important;
        padding:0;
    }

    .no-print{
        display:none !important;
    }

    .report{
        display:block !important;
        border:none !important;
        box-shadow:none !important;
        margin:0;
    }
}

</style>
</head>

<body>

<div class="container">

<img
src="./IMG_6426.jpeg"
class="logo"
alt="Q Option">

<div class="no-print">

<button
class="theme-button"
onclick="toggleThemes()">
🎨 الثيمات
</button>

<div id="themeMenu" class="theme-menu">

<button onclick="setTheme('')">🤍 Pure White</button>
<button onclick="setTheme('turquoise')">🩵 Ice Turquoise</button>
<button onclick="setTheme('mint')">🌿 Mint</button>
<button onclick="setTheme('pink')">🩷 Soft Pink</button>
<button onclick="setTheme('lavender')">💜 Lavender</button>
<button onclick="setTheme('silver')">🩶 Silver</button>
<button onclick="setTheme('midnight')">🖤 Midnight</button>
<button onclick="setTheme('navy')">🌌 Deep Navy</button>
<button onclick="setTheme('emerald')">🟢 Dark Emerald</button>
<button onclick="setTheme('darkpurple')">🟣 Dark Purple</button>

margin-top:15px;

">

alt="Q Option">

<script>

let trades =
JSON.parse(
localStorage.getItem("optionTrades") || "[]"
);

function toggleThemes(){

    document
    .getElementById("themeMenu")
    .classList
    .toggle("show");

}

function setTheme(theme){

    document.body.className=theme;

    localStorage.setItem(
        "optionTheme",
        theme
    );

    document
    .getElementById("themeMenu")
    .classList
    .remove("show");

}

const savedTheme =
localStorage.getItem("optionTheme");

if(savedTheme !== null){
    document.body.className=savedTheme;
}

function formatDate(date){

    if(!date){
        return "-";
    }

    const parts=date.split("-");

    if(parts.length!==3){
        return date;
    }

    return parts[2]+"/"+parts[1]+"/"+parts[0];
}

function toInputDate(date){

    const y=date.getFullYear();

    const m=String(
        date.getMonth()+1
    ).padStart(2,"0");

    const d=String(
        date.getDate()
    ).padStart(2,"0");

    return y+"-"+m+"-"+d;
}

function addTrade(){

    const stock=
    document.getElementById("stock").value.trim();

    const option=
    document.getElementById("option").value;

    const strike=
    parseFloat(
        document.getElementById("strike").value
    );

    const buy=
    parseFloat(
        document.getElementById("buy").value
    );

    const sell=
    parseFloat(
        document.getElementById("sell").value
    );

    const startDate=
    document.getElementById("startDate").value;

    const endDate=
    document.getElementById("endDate").value;

    if(
        stock==="" ||
        option==="" ||
        isNaN(strike) ||
        isNaN(buy) ||
        isNaN(sell) ||
        startDate==="" ||
        endDate===""
    ){

        alert(
            "⚠️ فضلاً أدخل جميع بيانات الصفقة والتواريخ"
        );

        return;
    }

    if(endDate<startDate){

        alert(
            "⚠️ تاريخ النهاية يجب أن يكون بعد تاريخ البداية"
        );

        return;
    }

    if(buy<=0){

        alert(
            "⚠️ سعر الشراء يجب أن يكون أكبر من صفر"
        );

        return;
    }

    const profit=sell-buy;

    const percentage=(profit/buy)*100;

    trades.push({

        id:Date.now(),
        stock,
        option,
        strike,
        buy,
        sell,
        startDate,
        endDate,
        profit,
        percentage

    });

    saveTrades();
    displayTrades();

    document.getElementById("stock").value="";
    document.getElementById("option").value="";
    document.getElementById("strike").value="";
    document.getElementById("buy").value="";
    document.getElementById("sell").value="";
    document.getElementById("startDate").value="";
    document.getElementById("endDate").value="";

}

function saveTrades(){

    localStorage.setItem(
        "optionTrades",
        JSON.stringify(trades)
    );

}

function getStatus(trade){

    if(Number(trade.sell)===0){

        return {
            name:"خاسرة",
            rowClass:"loss-row",
            textClass:"red"
        };

    }

    if(
        Number(trade.sell)<Number(trade.buy) &&
        Number(trade.sell)>0
    ){

        return {
            name:"موقوفة",
            rowClass:"stopped-row",
            textClass:"orange"
        };

    }

    return {
        name:"رابحة",
        rowClass:"win-row",
        textClass:"green"
    };

}

function escapeHTML(value){

    return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

function displayTrades(){

    const body=
    document.getElementById("tableBody");

    body.innerHTML="";

    if(trades.length===0){

        body.innerHTML=`

        <tr>
        <td colspan="10" class="empty">
        لا توجد صفقات حتى الآن
        </td>
        </tr>

        `;

        return;
    }

    trades.forEach(function(t,index){

        const status=getStatus(t);

        body.innerHTML+=`

        <tr>

        <td>${escapeHTML(t.stock)}</td>
        <td>${escapeHTML(t.option)}</td>
        <td>${Number(t.strike).toFixed(2)}</td>
        <td>${Number(t.buy).toFixed(2)}</td>
        <td>${Number(t.sell).toFixed(2)}</td>
        <td>${formatDate(t.startDate)}</td>
        <td>${formatDate(t.endDate)}</td>

        <td class="${status.textClass}">
        ${t.profit>=0?"+":""}${Number(t.profit).toFixed(2)}
        </td>

        <td class="${status.textClass}">
        ${t.percentage>=0?"+":""}${Number(t.percentage).toFixed(2)}%
        </td>

        <td class="no-print">

        <button
        class="delete-button"
        onclick="deleteTrade(${index})">
        حذف
        </button>

        </td>

        </tr>

        `;

    });

}

function deleteTrade(index){

    if(!confirm("هل تريد حذف هذه الصفقة؟")){
        return;
    }

    trades.splice(index,1);

    saveTrades();
    displayTrades();

}

function getWeekRange(offset){

    const now=new Date();

    now.setHours(0,0,0,0);

    const day=now.getDay();

    const diff=day===0?6:day-1;

    const monday=new Date(now);

    monday.setDate(
        now.getDate()-diff+(offset*7)
    );

    const sunday=new Date(monday);

    sunday.setDate(
        monday.getDate()+6
    );

    return {
        start:toInputDate(monday),
        end:toInputDate(sunday)
    };

}

function getMonthRange(offset){

    const now=new Date();

    const first=new Date(
        now.getFullYear(),
        now.getMonth()+offset,
        1
    );

    const last=new Date(
        now.getFullYear(),
        now.getMonth()+offset+1,
        0
    );

    return {
        start:toInputDate(first),
        end:toInputDate(last)
    };

}

function setReportPeriod(type,button){

    document
    .querySelectorAll(".filter-button")
    .forEach(
        b=>b.classList.remove("active")
    );

    if(button){
        button.classList.add("active");
    }

    let range;

    if(type==="thisWeek"){
        range=getWeekRange(0);
    }

    else if(type==="lastWeek"){
        range=getWeekRange(-1);
    }

    else if(type==="thisMonth"){
        range=getMonthRange(0);
    }

    else if(type==="lastMonth"){
        range=getMonthRange(-1);
    }

    else{

        document.getElementById("reportStart").value="";
        document.getElementById("reportEnd").value="";

        return;
    }

    document.getElementById("reportStart").value=range.start;
    document.getElementById("reportEnd").value=range.end;

}

function getFilteredTrades(){

    const start=
    document.getElementById("reportStart").value;

    const end=
    document.getElementById("reportEnd").value;

    if(!start&&!end){
        return trades;
    }

    return trades.filter(function(t){

        const tradeStart=t.startDate||"";
        const tradeEnd=t.endDate||"";

        return(
            tradeStart<=end &&
            tradeEnd>=start
        );

    });

}

function showReport(){

    const start=
    document.getElementById("reportStart").value;

    const end=
    document.getElementById("reportEnd").value;

    if(!start||!end){

        alert(
            "⚠️ اختاري فترة التقرير أولاً"
        );

        return;
    }

    if(end<start){

        alert(
            "⚠️ تاريخ نهاية التقرير غير صحيح"
        );

        return;
    }

    const filtered=getFilteredTrades();

    document
    .getElementById("report")
    .classList
    .add("show");

    const total=filtered.length;

    const winners=
    filtered.filter(
        t=>Number(t.sell)>Number(t.buy)
    ).length;

    const stopped=
    filtered.filter(
        t=>
        Number(t.sell)<Number(t.buy) &&
        Number(t.sell)>0
    ).length;

    const losers=
    filtered.filter(
        t=>Number(t.sell)===0
    ).length;

    const net=
    filtered.reduce(
        (sum,t)=>sum+Number(t.profit),
        0
    );

    const average=
    total
    ?
    filtered.reduce(
        (sum,t)=>sum+Number(t.percentage),
        0
    )/total
    :
    0;

    document.getElementById("totalTrades").textContent=total;
    document.getElementById("winningTrades").textContent=winners;
    document.getElementById("stoppedTrades").textContent=stopped;
    document.getElementById("losingTrades").textContent=losers;

    const netElement=
    document.getElementById("netProfit");

    netElement.textContent=
    (net>=0?"+":"")+net.toFixed(2);

    netElement.className=
    net>=0?"green":"red";

    document.getElementById("averagePercent").textContent=
    (average>=0?"+":"")+
    average.toFixed(2)+"%";

    document.getElementById("reportPeriod").textContent=
    "من "+
    formatDate(start)+
    " إلى "+
    formatDate(end);

    let html=`

    <table>

    <thead>

    <tr>
    <th>السهم</th>
    <th>الأوبشن</th>
    <th>السترايك</th>
    <th>الشراء</th>
    <th>البيع</th>
    <th>البداية</th>
    <th>النهاية</th>
    <th>الربح</th>
    <th>%</th>
    <th>الحالة</th>
    </tr>

    </thead>

    <tbody>

    `;

    if(filtered.length===0){

        html+=`

        <tr>
        <td colspan="10"
        style="padding:30px;text-align:center">
        لا توجد صفقات في هذه الفترة
        </td>
        </tr>

        `;

    }

    filtered.forEach(function(t){

        const status=getStatus(t);

        html+=`

        <tr class="${status.rowClass}">

        <td>${escapeHTML(t.stock)}</td>
        <td>${escapeHTML(t.option)}</td>
        <td>${Number(t.strike).toFixed(2)}</td>
        <td>${Number(t.buy).toFixed(2)}</td>
        <td>${Number(t.sell).toFixed(2)}</td>
        <td>${formatDate(t.startDate)}</td>
        <td>${formatDate(t.endDate)}</td>

        <td>
        ${t.profit>=0?"+":""}${Number(t.profit).toFixed(2)}
        </td>

        <td>
        ${t.percentage>=0?"+":""}${Number(t.percentage).toFixed(2)}%
        </td>

        <td>${status.name}</td>

        </tr>

        `;

    });

    html+=`
    </tbody>
    </table>
    `;

    document.getElementById("reportTable").innerHTML=html;

    document
    .getElementById("report")
    .scrollIntoView({
        behavior:"smooth",
        block:"start"
    });

}

function printReport(){

    const report=
    document.getElementById("report");

    if(!report.classList.contains("show")){
        showReport();
    }

    setTimeout(function(){
        window.print();
    },500);

}


/* =========================================================
   صورة التقرير
   يعمل بدون Blob
   ومناسب لـ Safari / iPhone / iPad / Mac / Chrome
========================================================= */

function saveReportImage(){

    const start=
    document.getElementById("reportStart").value;

    const end=
    document.getElementById("reportEnd").value;

    if(!start||!end){

        alert(
            "⚠️ اختاري فترة التقرير أولاً"
        );

        return;
    }

    const filtered=getFilteredTrades();

    const canvas=document.createElement("canvas");

    const ctx=canvas.getContext("2d");

    if(!ctx){

        alert(
            "❌ المتصفح لا يدعم إنشاء الصورة."
        );

        return;
    }

    const width=1600;
    const bannerHeight=190;
    const titleHeight=130;
    const statsHeight=250;
    const headerHeight=75;
    const rowHeight=70;
    const bottomHeight=70;

    const totalRows=Math.max(filtered.length,1);

    canvas.width=width;

    canvas.height=
        bannerHeight+
        titleHeight+
        statsHeight+
        headerHeight+
        (totalRows*rowHeight)+
        bottomHeight;

    ctx.fillStyle="#ffffff";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    /* البنر */

    ctx.fillStyle="#000000";

    ctx.fillRect(
        0,
        0,
        width,
        bannerHeight
    );

    const logo=new Image();

    logo.onload=function(){

        try{

            const logoSize=150;

            ctx.drawImage(
                logo,
                (width-logoSize)/2,
                (bannerHeight-logoSize)/2,
                logoSize,
                logoSize
            );

        }
        catch(e){

            console.log(
                "Logo drawing skipped",
                e
            );

        }

        drawReportCanvas();

    };

    logo.onerror=function(){

        drawReportCanvas();

    };

    /*
     * مهم:
     * استخدام المسار النسبي نفسه
     * الموجود في الصفحة.
     */

    logo.src="./IMG_6426.jpeg";


    function drawReportCanvas(){

        let y=bannerHeight;

        ctx.textAlign="center";

        ctx.fillStyle="#222222";

        ctx.font="800 42px Arial";

        ctx.fillText(
            "Q Option",
            width/2,
            y+52
        );

        ctx.font="25px Arial";

        ctx.fillStyle="#666666";

        ctx.fillText(
            "تقرير الصفقات",
            width/2,
            y+88
        );

        ctx.font="22px Arial";

        ctx.fillText(
            "من "+
            formatDate(start)+
            " إلى "+
            formatDate(end),
            width/2,
            y+118
        );

        y+=titleHeight;


        /* الإحصائيات */

        const winningCount=
        filtered.filter(
            t=>Number(t.sell)>Number(t.buy)
        ).length;

        const stoppedCount=
        filtered.filter(
            t=>
            Number(t.sell)<Number(t.buy)&&
            Number(t.sell)>0
        ).length;

        const losingCount=
        filtered.filter(
            t=>Number(t.sell)===0
        ).length;

        const net=
        filtered.reduce(
            (sum,t)=>sum+Number(t.profit),
            0
        );

        const average=
        filtered.length
        ?
        filtered.reduce(
            (sum,t)=>sum+Number(t.percentage),
            0
        )/filtered.length
        :
        0;

        const statsData=[

            [
                "إجمالي الصفقات",
                filtered.length,
                "#f2f4f5"
            ],

            [
                "🟢 الرابحة",
                winningCount,
                "#dff5e7"
            ],

            [
                "🩵 الموقوفة",
                stoppedCount,
                "#dff7fb"
            ],

            [
                "🔴 الخاسرة",
                losingCount,
                "#ffe1e1"
            ],

            [
                "صافي الربح",
                (net>=0?"+":"")+net.toFixed(2),
                net>=0?"#dff5e7":"#ffe1e1"
            ],

            [
                "متوسط %",
                (average>=0?"+":"")+average.toFixed(2)+"%",
                average>=0?"#dff5e7":"#ffe1e1"
            ]

        ];

        const statColumns=3;

        const statWidth=
        width/statColumns;

        const statHeight=125;

        statsData.forEach(function(stat,index){

            const row=
            Math.floor(index/statColumns);

            const column=
            index%statColumns;

            const x=
            column*statWidth;

            const boxY=
            y+row*statHeight;

            ctx.fillStyle=stat[2];

            ctx.fillRect(
                x+10,
                boxY+8,
                statWidth-20,
                statHeight-16
            );

            ctx.fillStyle="#222222";

            ctx.font="bold 23px Arial";

            ctx.fillText(
                stat[0],
                x+statWidth/2,
                boxY+48
            );

            ctx.font="bold 30px Arial";

            ctx.fillText(
                String(stat[1]),
                x+statWidth/2,
                boxY+91
            );

        });

        y+=statsHeight;


        /* رأس الجدول */

        const columns=[

            "السهم",
            "الأوبشن",
            "السترايك",
            "الشراء",
            "البيع",
            "البداية",
            "النهاية",
            "الربح",
            "%",
            "الحالة"

        ];

        const columnWidth=
        width/columns.length;

        ctx.fillStyle="#d9eef0";

        ctx.fillRect(
            0,
            y,
            width,
            headerHeight
        );

        ctx.fillStyle="#17363a";

        ctx.font="bold 20px Arial";

        columns.forEach(function(column,index){

            ctx.fillText(
                column,
                width-
                (index*columnWidth)-
                (columnWidth/2),
                y+46
            );

        });

        y+=headerHeight;


        /* لا توجد صفقات */

        if(filtered.length===0){

            ctx.fillStyle="#777777";

            ctx.font="22px Arial";

            ctx.fillText(
                "لا توجد صفقات في هذه الفترة",
                width/2,
                y+45
            );

        }


        /* الصفوف */

        filtered.forEach(function(t){

            const status=getStatus(t);

            if(status.name==="رابحة"){
                ctx.fillStyle="#dff5e7";
            }
            else if(status.name==="موقوفة"){
                ctx.fillStyle="#dff7fb";
            }
            else{
                ctx.fillStyle="#ffe1e1";
            }

            ctx.fillRect(
                0,
                y,
                width,
                rowHeight
            );

            ctx.strokeStyle="#d5d5d5";

            ctx.strokeRect(
                0,
                y,
                width,
                rowHeight
            );

            const values=[

                t.stock,
                t.option,
                Number(t.strike).toFixed(2),
                Number(t.buy).toFixed(2),
                Number(t.sell).toFixed(2),
                formatDate(t.startDate),
                formatDate(t.endDate),

                (
                    Number(t.profit)>=0
                    ?"+"
                    :""
                )+
                Number(t.profit).toFixed(2),

                (
                    Number(t.percentage)>=0
                    ?"+"
                    :""
                )+
                Number(t.percentage).toFixed(2)+"%",

                status.name

            ];

            ctx.fillStyle="#222222";

            ctx.font="18px Arial";

            values.forEach(function(value,index){

                ctx.fillText(
                    String(value),
                    width-
                    (index*columnWidth)-
                    (columnWidth/2),
                    y+44
                );

            });

            y+=rowHeight;

        });


        /* أسفل التقرير */

        ctx.textAlign="center";

        ctx.fillStyle="#777777";

        ctx.font="17px Arial";

        ctx.fillText(
            "Q Option",
            width/2,
            canvas.height-30
        );


        /*
         * هنا الإصلاح الأساسي:
         *
         * لا نستخدم Blob
         * ولا WebkitBlobResource
         *
         * نحول Canvas إلى Data URL
         * ثم نفتح صفحة مستقلة للصورة.
         */

        openImagePage();

    }


    function openImagePage(){

        let dataURL;

        try{

            dataURL=
            canvas.toDataURL(
                "image/png"
            );

        }
        catch(error){

            console.error(error);

            alert(
                "❌ تعذر إنشاء صورة التقرير."
            );

            return;
        }

        if(
            !dataURL ||
            dataURL.indexOf("data:image/png")!==0
        ){

            alert(
                "❌ تعذر تحويل التقرير إلى صورة."
            );

            return;
        }


        /*
         * نفتح نافذة جديدة.
         * هذا هو الأكثر توافقاً مع Safari.
         */

        const newWindow=
        window.open(
            "",
            "_blank"
        );

        if(!newWindow){

            /*
             * إذا منع Safari النافذة،
             * نعرض الصورة داخل نفس الصفحة.
             */

            showImageInCurrentPage(dataURL);

            return;
        }


        newWindow.document.open();

        newWindow.document.write(`

        `);

        newWindow.document.close();

    }


    /*
     * احتياط إذا منع المتصفح window.open
     */
