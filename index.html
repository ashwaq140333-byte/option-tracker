<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q Option</title>

<style>
:root{
    --bg:#f5f7f8;
    --card:#fff;
    --text:#202427;
    --secondary:#707b80;
    --border:#dfe5e8;
    --button:#202a2e;
    --buttonText:#fff;
    --header:#dceff0;
}

body.turquoise{--bg:#f0fbfc;--card:#fff;--text:#183034;--secondary:#6d858a;--border:#d4eeee;--button:#159da6;--buttonText:#fff;--header:#cfeef1}
body.mint{--bg:#f2faf6;--card:#fff;--text:#20332a;--secondary:#71847a;--border:#d9ebe1;--button:#39976c;--buttonText:#fff;--header:#d9eee3}
body.pink{--bg:#fff5f8;--card:#fff;--text:#39252c;--secondary:#8d7680;--border:#efdce4;--button:#d66f94;--buttonText:#fff;--header:#f6dce6}
body.lavender{--bg:#f8f5fc;--card:#fff;--text:#30283a;--secondary:#80758d;--border:#e6deef;--button:#8964b5;--buttonText:#fff;--header:#e9def3}
body.silver{--bg:#f3f5f6;--card:#fff;--text:#292d31;--secondary:#737b81;--border:#dde1e4;--button:#69737b;--buttonText:#fff;--header:#e2e6e8}
body.midnight{--bg:#090c11;--card:#151a22;--text:#f3f5f7;--secondary:#9da5ae;--border:#292f39;--button:#d5b044;--buttonText:#111;--header:#202631}
body.navy{--bg:#07111f;--card:#0e1b2d;--text:#edf6ff;--secondary:#8da3b8;--border:#1b3450;--button:#398bd5;--buttonText:#fff;--header:#142a42}
body.emerald{--bg:#06150f;--card:#0d2118;--text:#e9fff2;--secondary:#8fac9b;--border:#1b4932;--button:#24a866;--buttonText:#fff;--header:#153725}
body.darkpurple{--bg:#10091a;--card:#1c1029;--text:#f8efff;--secondary:#b5a4c1;--border:#3b2450;--button:#9656d8;--buttonText:#fff;--header:#2b173d}

*{box-sizing:border-box}

body{
    margin:0;
    padding:20px;
    background:var(--bg);
    color:var(--text);
    font-family:Arial,Tahoma,sans-serif;
}

.container{
    max-width:1150px;
    margin:auto;
}

.logo{
    width:130px;
    height:130px;
    object-fit:contain;
    display:block;
    margin:0 auto 5px;
}

h1{
    text-align:center;
    margin:0 0 20px;
    font-size:32px;
}

button,input,select{
    font-family:inherit;
}

.theme-button,
.report-button{
    display:block;
    margin:0 auto 12px;
    padding:12px 22px;
    background:var(--button);
    color:var(--buttonText);
    border:0;
    border-radius:11px;
    cursor:pointer;
    font-size:15px;
    font-weight:bold;
}

.theme-menu{
    display:none;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:15px;
    margin-bottom:20px;
    gap:10px;
}

.theme-menu.show{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
}

.theme-menu button{
    padding:12px;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--card);
    color:var(--text);
    cursor:pointer;
}

.form-box,
.table-box,
.report-filter,
.report{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:20px;
}

.form{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:12px;
}

.field{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.field label{
    font-size:13px;
    font-weight:bold;
    color:var(--secondary);
}

input,select{
    width:100%;
    padding:12px;
    border:1px solid var(--border);
    border-radius:9px;
    background:var(--card);
    color:var(--text);
    font-size:15px;
}

.add-button{
    width:100%;
    margin-top:16px;
    padding:14px;
    background:var(--button);
    color:var(--buttonText);
    border:0;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.table-box{
    margin-top:20px;
    overflow-x:auto;
}

table{
    width:100%;
    min-width:1050px;
    border-collapse:collapse;
}

th{
    background:var(--header);
    padding:13px;
}

td{
    padding:12px;
    text-align:center;
    border-bottom:1px solid var(--border);
}

.green{color:#13894e;font-weight:bold}
.orange{color:#00879c;font-weight:bold}
.red{color:#d62f2f;font-weight:bold}

.delete-button{
    background:#d93636;
    color:#fff;
    border:0;
    border-radius:7px;
    padding:7px 12px;
    cursor:pointer;
}

.empty{
    text-align:center;
    color:var(--secondary);
    padding:25px;
}

.report-filter{
    margin-top:20px;
}

.report-filter h3{
    text-align:center;
}

.filter-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:10px;
}

.filter-button{
    padding:11px;
    border:0;
    border-radius:9px;
    background:var(--header);
    color:var(--text);
    cursor:pointer;
    font-weight:bold;
}

.filter-button.active{
    background:var(--button);
    color:var(--buttonText);
}

.report{
    display:none;
    margin-top:20px;
    background:#fff !important;
    color:#222 !important;
}

.report.show{
    display:block;
}

.report-banner{
    height:150px;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    border-radius:12px;
    overflow:hidden;
}

.report-banner img{
    width:140px;
    height:140px;
    object-fit:contain;
}

.report h2{
    text-align:center;
    color:#222;
}

.report-period{
    text-align:center;
    color:#666;
}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:10px;
    margin:20px 0;
}

.stat{
    background:#f4f4f4;
    color:#222;
    padding:15px;
    border-radius:11px;
    text-align:center;
}

.stat strong{
    display:block;
    font-size:21px;
    margin-top:7px;
}

.report-table{
    overflow-x:auto;
}

.report-table table{
    background:#fff;
}

.report-table th{
    background:#d9eef0;
    color:#17363a;
    border:1px solid #b9d9dc;
}

.report-table td{
    border:1px solid #d5d5d5;
    color:#222;
}

.win-row td{background:#dff5e7;color:#126b3d}
.stopped-row td{background:#dff7fb;color:#00788c}
.loss-row td{background:#ffe1e1;color:#b52222}

.report-actions{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin:20px 0;
}

.report-action{
    background:#222;
    color:#fff;
    border:0;
    border-radius:9px;
    padding:12px 18px;
    cursor:pointer;
    font-weight:bold;
}

@media print{
    body{background:#fff;padding:0}
    .no-print{display:none!important}
    .report{display:block!important;border:0!important}
}
</style>
</head>

<body>

<div class="container">

<!--
    إذا عندك صورة شعار:
    ضعي IMG_6426.jpeg بجانب index.html
-->
<div style="text-align:center;font-size:55px;margin-bottom:5px">Ⓠ</div>

<h1>Q Option</h1>

<div class="no-print">

<button class="theme-button" onclick="toggleThemes()">
🎨 الثيمات
</button>

<div id="themeMenu" class="theme-menu">

<button onclick="setTheme('')">🤍 Pure White</button>
<button onclick="setTheme('turquoise')">🩵 Ice Turquoise</button>
<button onclick="setTheme('mint')">🌿 Mint</button>
<button onclick="setTheme('pink')">🩷 Soft Pink</button>
<button onclick="setTheme('lavender')">💜 Lavender</button>
<button onclick="setTheme('silver')">🩶 Silver</button>
<button onclick="setTheme('midnight')">🖤 Midnight</button>
<button onclick="setTheme('navy')">🌌 Deep Navy</button>
<button onclick="setTheme('emerald')">🟢 Dark Emerald</button>
<button onclick="setTheme('darkpurple')">🟣 Dark Purple</button>

</div>
</div>

<div class="form-box no-print">

<div class="form">

<div class="field">
<label>السهم</label>
<input id="stock" type="text" placeholder="مثال: TSLA">
</div>

<div class="field">
<label>الأوبشن</label>

<select id="option">
<option value="">اختر الأوبشن</option>
<option value="Call">Call 📈</option>
<option value="Put">Put 📉</option>
</select>

</div>

<div class="field">
<label>السترايك</label>
<input id="strike" type="number" step="0.01" placeholder="مثال: 300">
</div>

<div class="field">
<label>سعر الشراء</label>
<input id="buy" type="number" step="0.01" placeholder="سعر الشراء">
</div>

<div class="field">
<label>سعر البيع</label>
<input id="sell" type="number" step="0.01" placeholder="سعر البيع">
</div>

<div class="field">
<label>تاريخ بداية الصفقة</label>
<input id="startDate" type="date">
</div>

<div class="field">
<label>تاريخ نهاية الصفقة</label>
<input id="endDate" type="date">
</div>

</div>

<button class="add-button" onclick="addTrade()">
➕ إضافة الصفقة
</button>

</div>

<div class="table-box">

<table>

<thead>
<tr>
<th>السهم</th>
<th>الأوبشن</th>
<th>السترايك</th>
<th>الشراء</th>
<th>البيع</th>
<th>البداية</th>
<th>النهاية</th>
<th>الربح</th>
<th>%</th>
<th class="no-print">حذف</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>

</table>

</div>

<div class="report-filter no-print">

<h3>📅 اختر فترة التقرير</h3>

<div class="filter-grid">

<button class="filter-button" onclick="setReportPeriod('thisWeek',this)">
هذا الأسبوع
</button>

<button class="filter-button" onclick="setReportPeriod('lastWeek',this)">
الأسبوع السابق
</button>

<button class="filter-button" onclick="setReportPeriod('thisMonth',this)">
هذا الشهر
</button>

<button class="filter-button" onclick="setReportPeriod('lastMonth',this)">
الشهر السابق
</button>

<button class="filter-button" onclick="setReportPeriod('all',this)">
كل الصفقات
</button>

</div>

<div style="margin-top:15px;display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px">

<div class="field">
<label>من تاريخ</label>
<input id="reportStart" type="date">
</div>

<div class="field">
<label>إلى تاريخ</label>
<input id="reportEnd" type="date">
</div>

</div>

<button class="report-button" style="margin-top:15px" onclick="showReport()">
📄 إصدار التقرير
</button>

</div>

<div id="report" class="report">

<div class="report-banner">
<div style="color:white;font-size:80px">Ⓠ</div>
</div>

<h2>Q Option</h2>

<div id="reportPeriod" class="report-period"></div>

<div class="stats">

<div class="stat">
إجمالي الصفقات
<strong id="totalTrades">0</strong>
</div>

<div class="stat">
🟢 الرابحة
<strong id="winningTrades" class="green">0</strong>
</div>

<div class="stat">
🩵 الموقوفة
<strong id="stoppedTrades" class="orange">0</strong>
</div>

<div class="stat">
🔴 الخاسرة
<strong id="losingTrades" class="red">0</strong>
</div>

<div class="stat">
صافي الربح / الخسارة
<strong id="netProfit">0.00</strong>
</div>

متوسط الربح %
<strong id="averagePercent">0.00%</strong>
</div>

</div>

<div class="report-actions no-print">

<button class="report-action" onclick="printReport()">
📄 PDF
</button>

<button class="report-action" onclick="saveReportImage()">
🖼️ حفظ صورة التقرير
</button>

</div>

<div id="reportTable" class="report-table"></div>

</div>

</div>

<script>

let trades=[];

try{
    trades=JSON.parse(localStorage.getItem("optionTrades")||"[]");
    if(!Array.isArray(trades)) trades=[];
}catch(e){
    trades=[];
}


/* =========================
   الثيم
========================= */

function toggleThemes(){
    document.getElementById("themeMenu").classList.toggle("show");
}

function setTheme(theme){

    document.body.className=theme;

    localStorage.setItem("optionTheme",theme);

    document.getElementById("themeMenu")
    .classList.remove("show");
}

const savedTheme=localStorage.getItem("optionTheme");

if(savedTheme!==null){
    document.body.className=savedTheme;
}


/* =========================
   التاريخ
========================= */

function formatDate(date){

    if(!date)return "-";

    const parts=date.split("-");

    if(parts.length!==3)return date;

    return parts[2]+"/"+parts[1]+"/"+parts[0];
}

function toInputDate(date){

    const y=date.getFullYear();

    const m=String(date.getMonth()+1).padStart(2,"0");

    const d=String(date.getDate()).padStart(2,"0");

    return y+"-"+m+"-"+d;
}


/* =========================
   إضافة الصفقة
========================= */

function addTrade(){

    const stock=
    document.getElementById("stock").value.trim();

    const option=
    document.getElementById("option").value;

    const strike=
    parseFloat(document.getElementById("strike").value);

    const buy=
    parseFloat(document.getElementById("buy").value);

    const sell=
    parseFloat(document.getElementById("sell").value);

    const startDate=
    document.getElementById("startDate").value;

    const endDate=
    document.getElementById("endDate").value;


    if(
        !stock||
        !option||
        isNaN(strike)||
        isNaN(buy)||
        isNaN(sell)||
        !startDate||
        !endDate
    ){

        alert("⚠️ فضلاً أدخل جميع بيانات الصفقة والتواريخ");

        return;
    }


    if(endDate<startDate){

        alert("⚠️ تاريخ النهاية يجب أن يكون بعد تاريخ البداية");

        return;
    }


    if(buy<=0){

        alert("⚠️ سعر الشراء يجب أن يكون أكبر من صفر");

        return;
    }


    const profit=sell-buy;

    const percentage=(profit/buy)*100;


    trades.push({

        id:Date.now(),

        stock:stock.toUpperCase(),

        option,

        strike,

        buy,

        sell,

        startDate,

        endDate,

        profit,

        percentage

    });


    saveTrades();

    displayTrades();

    clearForm();
}


/* =========================
   تنظيف الحقول
========================= */

function clearForm(){

    document.getElementById("stock").value="";
    document.getElementById("option").value="";
    document.getElementById("strike").value="";
    document.getElementById("buy").value="";
    document.getElementById("sell").value="";
    document.getElementById("startDate").value="";
    document.getElementById("endDate").value="";
}


/* =========================
   حفظ
========================= */

function saveTrades(){

    localStorage.setItem(
        "optionTrades",
        JSON.stringify(trades)
    );
}


/* =========================
   حالة الصفقة
========================= */

function getStatus(trade){

    if(Number(trade.sell)===0){

        return{
            name:"خاسرة",
            rowClass:"loss-row",
            textClass:"red"
        };
    }


    if(
        Number(trade.sell)<Number(trade.buy)&&
        Number(trade.sell)>0
    ){

        return{
            name:"موقوفة",
            rowClass:"stopped-row",
            textClass:"orange"
        };
    }


    return{
        name:"رابحة",
        rowClass:"win-row",
        textClass:"green"
    };
}


/* =========================
   حماية النص
========================= */

function escapeHTML(value){

    return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =========================
   عرض الصفقات
========================= */

function displayTrades(){

    const body=document.getElementById("tableBody");

    body.innerHTML="";


    if(trades.length===0){

        body.innerHTML=`

        <tr>
        <td colspan="10" class="empty">
        لا توجد صفقات حتى الآن
        </td>
        </tr>

        `;

        return;
    }


    trades.forEach(function(t,index){

        const status=getStatus(t);


        body.innerHTML+=`

        <tr>

        <td>${escapeHTML(t.stock)}</td>

        <td>${escapeHTML(t.option)}</td>

        <td>${Number(t.strike).toFixed(2)}</td>

        <td>${Number(t.buy).toFixed(2)}</td>

        <td>${Number(t.sell).toFixed(2)}</td>

        <td>${formatDate(t.startDate)}</td>

        <td>${formatDate(t.endDate)}</td>

        <td class="${status.textClass}">
        ${t.profit>=0?"+":""}${Number(t.profit).toFixed(2)}
        </td>

        <td class="${status.textClass}">
        ${t.percentage>=0?"+":""}${Number(t.percentage).toFixed(2)}%
        </td>

        <td class="no-print">

        <button
        class="delete-button"
        onclick="deleteTrade(${index})">
        حذف
        </button>

        </td>

        </tr>

        `;
    });
}


/* =========================
   حذف
========================= */

function deleteTrade(index){

    if(!confirm("هل تريد حذف هذه الصفقة؟"))return;

    trades.splice(index,1);

    saveTrades();

    displayTrades();
}


/* =========================
   فترات التقرير
========================= */

function getWeekRange(offset){

    const now=new Date();

    now.setHours(0,0,0,0);

    const day=now.getDay();

    const diff=day===0?6:day-1;

    const monday=new Date(now);

    monday.setDate(
        now.getDate()-diff+(offset*7)
    );

    const sunday=new Date(monday);

    sunday.setDate(
        monday.getDate()+6
    );

    return{
        start:toInputDate(monday),
        end:toInputDate(sunday)
    };
}


function getMonthRange(offset){

    const now=new Date();

    const first=new Date(
        now.getFullYear(),
        now.getMonth()+offset,
        1
    );

    const last=new Date(
        now.getFullYear(),
        now.getMonth()+offset+1,
        0
    );

    return{
        start:toInputDate(first),
        end:toInputDate(last)
    };
}


function setReportPeriod(type,button){

    document
    .querySelectorAll(".filter-button")
    .forEach(function(b){
        b.classList.remove("active");
    });


    if(button){
        button.classList.add("active");
    }


    let range;


    if(type==="thisWeek"){
        range=getWeekRange(0);
    }

    else if(type==="lastWeek"){
        range=getWeekRange(-1);
    }

    else if(type==="thisMonth"){
        range=getMonthRange(0);
    }

    else if(type==="lastMonth"){
        range=getMonthRange(-1);
    }

    else{

        document.getElementById("reportStart").value="";
        document.getElementById("reportEnd").value="";

        return;
    }


    document.getElementById("reportStart").value=range.start;

    document.getElementById("reportEnd").value=range.end;
}


/* =========================
   فلترة
========================= */

function getFilteredTrades(){

    const start=
    document.getElementById("reportStart").value;

    const end=
    document.getElementById("reportEnd").value;


    if(!start&&!end)return trades;


    return trades.filter(function(t){

        return(
            (t.startDate||"")<=end &&
            (t.endDate||"")>=start
        );
    });
}


/* =========================
   التقرير
========================= */

function showReport(){

    const start=
    document.getElementById("reportStart").value;

    const end=
    document.getElementById("reportEnd").value;


    if(!start||!end){

        alert("⚠️ اختاري فترة التقرير أولاً");

        return;
    }


    if(end<start){

        alert("⚠️ تاريخ نهاية التقرير غير صحيح");

        return;
    }


    const filtered=getFilteredTrades();


    document
    .getElementById("report")
    .classList
    .add("show");


    const total=filtered.length;


    const winners=
    filtered.filter(
        t=>Number(t.sell)>Number(t.buy)
    ).length;


    const stopped=
    filtered.filter(
        t=>
        Number(t.sell)<Number(t.buy)&&
        Number(t.sell)>0
    ).length;


    const losers=
    filtered.filter(
        t=>Number(t.sell)===0
    ).length;


    const net=
    filtered.reduce(
        (sum,t)=>sum+Number(t.profit||0),
        0
    );


    const average=
    total
    ?
    filtered.reduce(
        (sum,t)=>sum+Number(t.percentage||0),
        0
    )/total
    :
    0;


    document.getElementById("totalTrades").textContent=total;

    document.getElementById("winningTrades").textContent=winners;

    document.getElementById("stoppedTrades").textContent=stopped;

    document.getElementById("losingTrades").textContent=losers;


    const netElement=
    document.getElementById("netProfit");

    netElement.textContent=
    (net>=0?"+":"")+net.toFixed(2);

    netElement.className=
    net>=0?"green":"red";


    document.getElementById("averagePercent").textContent=
    (average>=0?"+":"")+
    average.toFixed(2)+"%";


    document.getElementById("reportPeriod").textContent=
    "من "+formatDate(start)+" إلى "+formatDate(end);


    let html=`

    <table>

    <thead>

    <tr>
    <th>السهم</th>
    <th>الأوبشن</th>
    <th>السترايك</th>
    <th>الشراء</th>
    <th>البيع</th>
    <th>البداية</th>
    <th>النهاية</th>
    <th>الربح</th>
    <th>%</th>
    <th>الحالة</th>
    </tr>

    </thead>

    <tbody>
    `;


    if(filtered.length===0){

        html+=`

        <tr>
        <td colspan="10" style="padding:30px;text-align:center">
        لا توجد صفقات في هذه الفترة
        </td>
        </tr>

        `;
    }


    filtered.forEach(function(t){

        const status=getStatus(t);


        html+=`

        <tr class="${status.rowClass}">

        <td>${escapeHTML(t.stock)}</td>

        <td>${escapeHTML(t.option)}</td>

        <td>${Number(t.strike).toFixed(2)}</td>

        <td>${Number(t.buy).toFixed(2)}</td>

        <td>${Number(t.sell).toFixed(2)}</td>

        <td>${formatDate(t.startDate)}</td>

        <td>${formatDate(t.endDate)}</td>

        <td>
        ${t.profit>=0?"+":""}${Number(t.profit).toFixed(2)}
        </td>

        <td>
        ${t.percentage>=0?"+":""}${Number(t.percentage).toFixed(2)}%
        </td>

        <td>${status.name}</td>

        </tr>

        `;
    });


    html+=`
    </tbody>
    </table>
    `;


    document.getElementById("reportTable").innerHTML=html;


    document
    .getElementById("report")
    .scrollIntoView({
        behavior:"smooth",
        block:"start"
    });
}


/* =========================
   PDF
========================= */

function printReport(){

    const report=
    document.getElementById("report");


    if(!report.classList.contains("show")){

        showReport();
    }


    setTimeout(function(){

        window.print();

    },300);
}


/* =========================
   صورة التقرير
========================= */

function saveReportImage(){

    const start=
    document.getElementById("reportStart").value;

    const end=
    document.getElementById("reportEnd").value;


    if(!start||!end){

        alert("⚠️ اختاري فترة التقرير أولاً");

        return;
    }


    const filtered=getFilteredTrades();


    const width=1400;

    const rowHeight=65;

    const height=
        180+
        150+
        250+
        70+
        Math.max(filtered.length,1)*rowHeight+
        80;


    const canvas=document.createElement("canvas");

    canvas.width=width;

    canvas.height=height;


    const ctx=canvas.getContext("2d");


    if(!ctx){

        alert("❌ المتصفح لا يدعم إنشاء الصورة");

        return;
    }


    ctx.fillStyle="#fff";

    ctx.fillRect(0,0,width,height);


    /* البنر */

    ctx.fillStyle="#000";

    ctx.fillRect(0,0,width,180);


    ctx.fillStyle="#fff";

    ctx.font="bold 80px Arial";

    ctx.textAlign="center";

    ctx.fillText("Ⓠ",width/2,115);


    /* العنوان */

    ctx.fillStyle="#222";

    ctx.font="bold 38px Arial";

    ctx.fillText("Q Option",width/2,225);


    ctx.font="22px Arial";

    ctx.fillStyle="#666";

    ctx.fillText(
        "تقرير الصفقات — من "+
        formatDate(start)+
        " إلى "+
        formatDate(end),
        width/2,
        265
    );


    /* الإحصائيات */

    const winners=
    filtered.filter(
        t=>Number(t.sell)>Number(t.buy)
    ).length;


    const stopped=
    filtered.filter(
        t=>
        Number(t.sell)<Number(t.buy)&&
        Number(t.sell)>0
    ).length;


    const losers=
    filtered.filter(
        t=>Number(t.sell)===0
    ).length;


    const net=
    filtered.reduce(
        (s,t)=>s+Number(t.profit||0),
        0
    );


    const average=
    filtered.length
    ?
    filtered.reduce(
        (s,t)=>s+Number(t.percentage||0),
        0
    )/filtered.length
    :
    0;


    const stats=[
        ["إجمالي الصفقات",filtered.length],
        ["🟢 الرابحة",winners],
        ["🩵 الموقوفة",stopped],
        ["🔴 الخاسرة",losers],
        ["صافي الربح",(net>=0?"+":"")+net.toFixed(2)],
        ["متوسط %",(average>=0?"+":"")+average.toFixed(2)+"%"]
    ];


    const boxW=width/3;

    stats.forEach(function(s,i){

        const col=i%3;

        const row=Math.floor(i/3);

        const x=col*boxW;

        const y=305+row*110;


        ctx.fillStyle="#f1f3f4";

        ctx.fillRect(
            x+10,
            y,
            boxW-20,
            95
        );


        ctx.fillStyle="#222";

        ctx.font="bold 20px Arial";

        ctx.fillText(
            s[0],
            x+boxW/2,
            y+38
        );


        ctx.font="bold 27px Arial";

        ctx.fillText(
            String(s[1]),
            x+boxW/2,
            y+75
        );
    });


    let y=545;


    /* رأس الجدول */

    ctx.fillStyle="#d9eef0";

    ctx.fillRect(0,y,width,70);


    const columns=[
        "السهم",
        "الأوبشن",
        "السترايك",
        "الشراء",
        "البيع",
        "البداية",
        "النهاية",
        "الربح",
        "%",
        "الحالة"
    ];


    const cw=width/columns.length;


    ctx.fillStyle="#17363a";

    ctx.font="bold 17px Arial";


    columns.forEach(function(c,i){

        ctx.fillText(
            c,
            width-(i*cw)-(cw/2),
            y+43
        );
    });


    y+=70;


    if(filtered.length===0){

        ctx.fillStyle="#777";

        ctx.font="22px Arial";

        ctx.fillText(
            "لا توجد صفقات في هذه الفترة",
            width/2,
            y+45
        );

    }


    filtered.forEach(function(t){

        const status=getStatus(t);


        if(status.name==="رابحة"){
            ctx.fillStyle="#dff5e7";
        }
        else if(status.name==="موقوفة"){
            ctx.fillStyle="#dff7fb";
        }
        else{
            ctx.fillStyle="#ffe1e1";
        }


        ctx.fillRect(
            0,
            y,
            width,
            rowHeight
        );


        const values=[
            t.stock,
            t.option,
            Number(t.strike).toFixed(2),
            Number(t.buy).toFixed(2),
            Number(t.sell).toFixed(2),
            formatDate(t.startDate),
            formatDate(t.endDate),
            (t.profit>=0?"+":"")+Number(t.profit).toFixed(2),
            (t.percentage>=0?"+":"")+Number(t.percentage).toFixed(2)+"%",
            status.name
        ];


        ctx.fillStyle="#222";

        ctx.font="16px Arial";


        values.forEach(function(v,i){

            ctx.fillText(
                String(v),
                width-(i*cw)-(cw/2),
                y+40
            );
        });


        y+=rowHeight;
    });


    ctx.fillStyle="#777";

    ctx.font="16px Arial";

    ctx.fillText(
        "Q Option",
        width/2,
        height-30
    );


    let dataURL;


    try{

        dataURL=canvas.toDataURL("image/png");

    }catch(e){

        alert("❌ تعذر إنشاء صورة التقرير");

        return;
    }


    /*
      بدل window.open:
      نضع الصورة مباشرة في صفحة جديدة
      ونوفر زر حفظ.
    */

    const win=window.open("","_blank");


    if(!win){

        alert(
            "⚠️ المتصفح منع فتح صفحة الصورة. اضغطي على زر الصورة مرة ثانية."
        );

        return;
    }


    win.document.write(`
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Q Option Report</title>

<style>

body{
    margin:0;
    padding:20px;
    background:#eee;
    text-align:center;
    font-family:Arial,sans-serif;
}

img{
    max-width:100%;
    height:auto;
    background:#fff;
    display:block;
    margin:20px auto;
    box-shadow:0 4px 20px #0003;
}

button{
    background:#222;
    color:#fff;
    border:0;
    border-radius:10px;
    padding:14px 22px;
    font-size:16px;
    font-weight:bold;
}

</style>

</head>

<body>

<h2>🖼️ Q Option — صورة التقرير</h2>

<img src="${dataURL}" alt="Q Option Report">

<p>
اضغطي مطولاً على الصورة في الآيفون ثم اختاري
<strong>حفظ في الصور</strong>.
</p>

<button onclick="window.print()">
📄 طباعة / PDF
</button>

</body>
</html>
    `);


    win.document.close();
}

displayTrades();
