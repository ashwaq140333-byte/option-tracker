<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>متابعة الأوبشن</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>

/* =========================
   الثيمات
========================= */

:root{
    --bg:#f5f6fa;
    --card:#ffffff;
    --text:#222222;
    --secondary:#777777;
    --border:#dddddd;
    --button:#222222;
    --buttonText:#ffffff;
    --header:#eeeeee;
}

body.midnight{
    --bg:#0b0d12;
    --card:#151922;
    --text:#f4f4f4;
    --secondary:#9da3af;
    --border:#292e38;
    --button:#d4af37;
    --buttonText:#111111;
    --header:#202631;
}

body.cyber{
    --bg:#06111f;
    --card:#0d1b2d;
    --text:#e8f4ff;
    --secondary:#8fa8c0;
    --border:#193653;
    --button:#168cff;
    --buttonText:#ffffff;
    --header:#132b45;
}

body.titanium{
    --bg:#25272b;
    --card:#34373c;
    --text:#f1f1f1;
    --secondary:#b9bdc3;
    --border:#50545b;
    --button:#aeb4bd;
    --buttonText:#111111;
    --header:#41454b;
}

body.trading{
    --bg:#06140e;
    --card:#0d2118;
    --text:#e7fff1;
    --secondary:#91b5a0;
    --border:#1b4931;
    --button:#18a558;
    --buttonText:#ffffff;
    --header:#153523;
}

body.purple{
    --bg:#100819;
    --card:#1c1029;
    --text:#f8ecff;
    --secondary:#bda8c8;
    --border:#3d2450;
    --button:#9b4dff;
    --buttonText:#ffffff;
    --header:#29163a;
}

body.gold{
    --bg:#080808;
    --card:#151515;
    --text:#f5f1df;
    --secondary:#aaa38b;
    --border:#3b3521;
    --button:#c9a227;
    --buttonText:#111111;
    --header:#242017;
}

body.ocean{
    --bg:#04151d;
    --card:#09242e;
    --text:#e7fbff;
    --secondary:#8cb4be;
    --border:#164552;
    --button:#19a9c5;
    --buttonText:#ffffff;
    --header:#10343e;
}

body.market{
    --bg:#100808;
    --card:#1d1010;
    --text:#fff0f0;
    --secondary:#bd9999;
    --border:#482020;
    --button:#c83232;
    --buttonText:#ffffff;
    --header:#321717;
}


/* =========================
   الصفحة
========================= */

body{
    font-family:Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    margin:0;
    padding:20px;
    transition:.3s;
}

.container{
    max-width:1100px;
    margin:auto;
}

.logo{
    width:70px;
    height:70px;
    object-fit:contain;
    display:block;
    margin:0 auto 8px;
}

h1{
    text-align:center;
    margin-bottom:20px;
}


/* =========================
   الأزرار
========================= */

.theme-button,
.report-button{
    display:block;
    margin:0 auto 10px;
    padding:11px 20px;
    background:var(--button);
    color:var(--buttonText);
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:15px;
}

.theme-menu{
    display:none;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:15px;
    padding:15px;
    margin-bottom:20px;
    gap:10px;
}

.theme-menu.show{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
}

.theme-menu button{
    padding:12px;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--card);
    color:var(--text);
    cursor:pointer;
}


/* =========================
   نموذج الصفقة
========================= */

.form-box{
    background:var(--card);
    padding:20px;
    border-radius:15px;
    border:1px solid var(--border);
    box-shadow:0 3px 15px #00000020;
}

.form{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:10px;
}

input,
select{
    width:100%;
    padding:12px;
    border:1px solid var(--border);
    border-radius:8px;
    font-size:15px;
    box-sizing:border-box;
    background:var(--card);
    color:var(--text);
}

.add-button{
    margin-top:15px;
    width:100%;
    padding:13px;
    background:var(--button);
    color:var(--buttonText);
    border:none;
    border-radius:9px;
    font-size:16px;
    cursor:pointer;
}


/* =========================
   جدول الصفقات
========================= */

.table-box{
    margin-top:20px;
    background:var(--card);
    padding:15px;
    border-radius:15px;
    border:1px solid var(--border);
    overflow-x:auto;
}

table{
    width:100%;
    min-width:850px;
    border-collapse:collapse;
}

th{
    background:var(--header);
    color:var(--text);
    padding:13px;
}

td{
    padding:12px;
    text-align:center;
    border-bottom:1px solid var(--border);
}

.green{
    color:#168a52;
    font-weight:bold;
}

.orange{
    color:#008ca3;
    font-weight:bold;
}

.red{
    color:#d93030;
    font-weight:bold;
}

.delete-button{
    background:#d93636;
    color:#ffffff;
    border:none;
    border-radius:7px;
    padding:7px 12px;
    cursor:pointer;
}

.empty{
    text-align:center;
    color:var(--secondary);
    padding:25px;
}


/* =========================
   التقرير
========================= */

.report{
    display:none;

    background:#ffffff !important;
    color:#222222 !important;

    border:1px solid #dddddd;
    border-radius:15px;

    padding:20px;
    margin-top:20px;
}

.report.show{
    display:block;
}

.report h2{
    text-align:center;
    margin-top:0;
    color:#222222 !important;
}

.report-date{
    text-align:center;
    color:#666666 !important;
    margin-bottom:20px;
}


/* =========================
   إحصائيات التقرير
========================= */

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:10px;
    margin:20px 0;
}

.stat{
    background:#f4f4f4 !important;
    color:#222222 !important;
    padding:15px;
    border-radius:10px;
    text-align:center;
}

.stat strong{
    display:block;
    font-size:20px;
    margin-top:7px;
}


/* =========================
   جدول التقرير النهائي
========================= */

.report-table{
    background:#ffffff !important;
    color:#222222 !important;
    border-radius:10px;
    overflow:hidden;
}

.report-table table{
    width:100%;
    min-width:850px;
    border-collapse:collapse;
    background:#ffffff !important;
}

.report-table th{
    background:#eeeeee !important;
    color:#222222 !important;
    border:1px solid #d5d5d5;
    padding:12px;
}

.report-table td{
    color:#222222 !important;
    border:1px solid #d5d5d5;
    padding:11px;
}


/* رابحة */

.report-table tr.win-row{
    background:#dff5e7 !important;
}

.report-table tr.win-row td{
    background:#dff5e7 !important;
    color:#126b3d !important;
}


/* موقوفة */

.report-table tr.stopped-row{
    background:#dff7fb !important;
}

.report-table tr.stopped-row td{
    background:#dff7fb !important;
    color:#00788c !important;
}


/* خاسرة */

.report-table tr.loss-row{
    background:#ffe1e1 !important;
}

.report-table tr.loss-row td{
    background:#ffe1e1 !important;
    color:#b52222 !important;
}


/* =========================
   أزرار التقرير
========================= */

.report-actions{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.report-action{
    background:#222222;
    color:#ffffff;
    border:none;
    border-radius:9px;
    padding:12px 18px;
    cursor:pointer;
    font-size:15px;
}


/* =========================
   الطباعة
========================= */

@media print{

    body{
        background:#ffffff !important;
        color:#222222 !important;
    }

    .no-print{
        display:none !important;
    }

    .report{
        display:block !important;
        border:none !important;
        box-shadow:none !important;
        background:#ffffff !important;
    }

    .report-table{
        background:#ffffff !important;
    }

    .report-table tr.win-row td{
        background:#dff5e7 !important;
    }

    .report-table tr.stopped-row td{
        background:#dff7fb !important;
    }

    .report-table tr.loss-row td{
        background:#ffe1e1 !important;
    }
}

</style>
</head>


<body>

<div class="container">


<img
src="./IMG_6426.jpeg"
class="logo"
alt="شعار البرنامج"
>


<h1>متابعة الأوبشن</h1>


<!-- الثيمات -->

<div class="no-print">

<button
class="theme-button"
onclick="toggleThemes()">

🎨 الثيمات

</button>


<div
id="themeMenu"
class="theme-menu">

<button onclick="setTheme('midnight')">
🖤 Midnight
</button>

<button onclick="setTheme('cyber')">
💙 Cyber Blue
</button>

<button onclick="setTheme('titanium')">
🩶 Titanium
</button>

<button onclick="setTheme('trading')">
🟢 Trading Green
</button>

<button onclick="setTheme('purple')">
🟣 Neon Purple
</button>

<button onclick="setTheme('gold')">
🟡 Black Gold
</button>

<button onclick="setTheme('ocean')">
🌊 Deep Ocean
</button>

<button onclick="setTheme('market')">
🔴 Market Red
</button>

</div>

</div>


<!-- إضافة الصفقة -->

<div class="form-box no-print">

<div class="form">

<input
id="stock"
type="text"
placeholder="السهم"
>

<select id="option">

<option value="">
اختر الأوبشن
</option>

<option value="Call">
Call 📈
</option>

<option value="Put">
Put 📉
</option>

</select>

<input
id="strike"
type="number"
step="0.01"
placeholder="السترايك"
>

<input
id="buy"
type="number"
step="0.01"
placeholder="سعر الشراء"
>

<input
id="sell"
type="number"
step="0.01"
placeholder="سعر البيع"
>

</div>


<button
class="add-button"
onclick="addTrade()">

➕ إضافة الصفقة

</button>

</div>


<!-- جدول الصفقات -->

<div class="table-box">

<table>

<thead>

<tr>

<th>السهم</th>
<th>الأوبشن</th>
<th>السترايك</th>
<th>سعر الشراء</th>
<th>سعر البيع</th>
<th>الربح</th>
<th>الأرباح %</th>
<th class="no-print">حذف</th>

</tr>

</thead>


<tbody id="tableBody">

<tr>

<td
colspan="8"
class="empty">

لا توجد صفقات حتى الآن

</td>

</tr>

</tbody>

</table>

</div>


<!-- زر التقرير -->

<div class="no-print">

<button
class="report-button"
onclick="showReport()">

📄 إصدار تقرير

</button>

</div>


<!-- التقرير -->

<div
id="report"
class="report">


<h2>
📊 تقرير صفقات الأوبشن
</h2>


<div
id="reportDate"
class="report-date">
</div>


<div class="stats">


<div class="stat">

إجمالي الصفقات

<strong
id="totalTrades">
0
</strong>

</div>


<div class="stat">

🟢 الرابحة

<strong
id="winningTrades"
class="green">
0
</strong>

</div>


<div class="stat">

🩵 الموقوفة

<strong
id="stoppedTrades"
class="orange">
0
</strong>

</div>


<div class="stat">

🔴 الخاسرة

<strong
id="losingTrades"
class="red">
0
</strong>

</div>


<div class="stat">

صافي الربح / الخسارة

<strong id="netProfit">
0.00
</strong>

</div>


<div class="stat">

متوسط الربح %

<strong id="averagePercent">
0.00%
</strong>

</div>


</div>


<!-- أزرار التصدير -->

<div class="report-actions no-print">

<button
class="report-action"
onclick="printReport()">

📄 PDF

</button>


<button
class="report-action"
onclick="saveReportImage()">

🖼️ حفظ كصورة

</button>

</div>


<!-- جدول التقرير -->

<div
id="reportTable"
class="report-table">
</div>


</div>


</div>


<script>


/* =========================
   الصفقات المحفوظة
========================= */

let trades =
JSON.parse(
localStorage.getItem("optionTrades") || "[]"
);


/* =========================
   الثيمات
========================= */

function toggleThemes(){

    document
    .getElementById("themeMenu")
    .classList.toggle("show");

}


function setTheme(theme){

    document.body.className=theme;

    localStorage.setItem(
        "optionTheme",
        theme
    );

    document
    .getElementById("themeMenu")
    .classList.remove("show");

}


const savedTheme =
localStorage.getItem("optionTheme");


if(savedTheme){

    document.body.className =
    savedTheme;

}


/* =========================
   إضافة صفقة
========================= */

function addTrade(){

    const stock =
    document
    .getElementById("stock")
    .value
    .trim();


    const option =
    document
    .getElementById("option")
    .value;


    const strike =
    parseFloat(
        document
        .getElementById("strike")
        .value
    );


    const buy =
    parseFloat(
        document
        .getElementById("buy")
        .value
    );


    const sell =
    parseFloat(
        document
        .getElementById("sell")
        .value
    );


    if(
        stock === "" ||
        option === "" ||
        isNaN(strike) ||
        isNaN(buy) ||
        isNaN(sell)
    ){

        alert(
            "⚠️ فضلاً أدخل جميع البيانات"
        );

        return;

    }


    if(buy <= 0){

        alert(
            "⚠️ سعر الشراء يجب أن يكون أكبر من صفر"
        );

        return;

    }


    const profit =
    sell - buy;


    const percentage =
    (profit / buy) * 100;


    trades.push({

        stock,
        option,
        strike,
        buy,
        sell,
        profit,
        percentage

    });


    saveTrades();

    displayTrades();


    document.getElementById("stock").value="";
    document.getElementById("option").value="";
    document.getElementById("strike").value="";
    document.getElementById("buy").value="";
    document.getElementById("sell").value="";

}


/* =========================
   الحفظ
========================= */

function saveTrades(){

    localStorage.setItem(
        "optionTrades",
        JSON.stringify(trades)
    );

}


/* =========================
   حالة الصفقة
========================= */

function getStatus(trade){

    if(trade.sell === 0){

        return {
            name:"خاسرة",
            rowClass:"loss-row",
            textClass:"red"
        };

    }


    if(
        trade.sell < trade.buy &&
        trade.sell > 0
    ){

        return {
            name:"موقوفة",
            rowClass:"stopped-row",
            textClass:"orange"
        };

    }


    return {
        name:"رابحة",
        rowClass:"win-row",
        textClass:"green"
    };

}


/* =========================
   عرض الصفقات
========================= */

function displayTrades(){

    const tableBody =
    document
    .getElementById("tableBody");


    tableBody.innerHTML="";


    if(trades.length===0){

        tableBody.innerHTML=`

        <tr>

        <td
        colspan="8"
        class="empty">

        لا توجد صفقات حتى الآن

        </td>

        </tr>

        `;

        return;

    }


    trades.forEach(
    function(trade,index){

        const status =
        getStatus(trade);


        const sign =
        trade.profit >= 0
        ? "+"
        : "";


        const row=`

        <tr>

        <td>${trade.stock}</td>

        <td>${trade.option}</td>

        <td>${trade.strike.toFixed(2)}</td>

        <td>${trade.buy.toFixed(2)}</td>

        <td>${trade.sell.toFixed(2)}</td>

        <td class="${status.textClass}">

        ${sign}${trade.profit.toFixed(2)}

        </td>

        <td class="${status.textClass}">

        ${trade.percentage >= 0 ? "+" : ""}
        ${trade.percentage.toFixed(2)}%

        </td>

        <td class="no-print">

        <button
        class="delete-button"
        onclick="deleteTrade(${index})">

        حذف

        </button>

        </td>

        </tr>

        `;


        tableBody.innerHTML += row;

    });

}


/* =========================
   حذف
========================= */

function deleteTrade(index){

    trades.splice(index,1);

    saveTrades();

    displayTrades();

}


/* =========================
   التقرير
========================= */

function showReport(){

    const report =
    document.getElementById("report");


    report.classList.add("show");


    const total =
    trades.length;


    const winners =
    trades.filter(
        t => t.sell > t.buy
    ).length;


    const stopped =
    trades.filter(
        t =>
        t.sell < t.buy &&
        t.sell > 0
    ).length;


    const losers =
    trades.filter(
        t => t.sell === 0
    ).length;


    const net =
    trades.reduce(
        (sum,t) =>
        sum + t.profit,
        0
    );


    const average =
    total
    ?
    trades.reduce(
        (sum,t) =>
        sum + t.percentage,
        0
    ) / total
    :
    0;


    document
    .getElementById("totalTrades")
    .textContent=total;


    document
    .getElementById("winningTrades")
    .textContent=winners;


    document
    .getElementById("stoppedTrades")
    .textContent=stopped;


    document
    .getElementById("losingTrades")
    .textContent=losers;


    const netElement =
    document
    .getElementById("netProfit");


    netElement.textContent =
    (net >= 0 ? "+" : "") +
    net.toFixed(2);


    netElement.className =
    net >= 0
    ? "green"
    : "red";


    document
    .getElementById("averagePercent")
    .textContent =
    (average >= 0 ? "+" : "") +
    average.toFixed(2) +
    "%";


    /* تاريخ التقرير */

    const now =
    new Date();


    document
    .getElementById("reportDate")
    .textContent =
    "تاريخ التقرير: " +
    now.toLocaleDateString("ar-SA");


    /* جدول التقرير */

    let html=`

    <table>

    <thead>

    <tr>

    <th>السهم</th>
    <th>الأوبشن</th>
    <th>السترايك</th>
    <th>الشراء</th>
    <th>البيع</th>
    <th>الربح</th>
    <th>%</th>
    <th>الحالة</th>

    </tr>

    </thead>

    <tbody>

    `;


    trades.forEach(t=>{

        const status =
        getStatus(t);


        html += `

        <tr class="${status.rowClass}">

        <td>${t.stock}</td>

        <td>${t.option}</td>

        <td>${t.strike.toFixed(2)}</td>

        <td>${t.buy.toFixed(2)}</td>

        <td>${t.sell.toFixed(2)}</td>

        <td>

        ${t.profit >= 0 ? "+" : ""}
        ${t.profit.toFixed(2)}

        </td>

        <td>

        ${t.percentage >= 0 ? "+" : ""}
        ${t.percentage.toFixed(2)}%

        </td>

        <td>

        ${status.name}

        </td>

        </tr>

        `;

    });


    html += `

    </tbody>

    </table>

    `;


    document
    .getElementById("reportTable")
    .innerHTML=html;


    report.scrollIntoView({
        behavior:"smooth"
    });

}


/* =========================
   PDF
========================= */

function printReport(){

    if(trades.length===0){

        alert(
            "⚠️ لا توجد صفقات لإصدار التقرير"
        );

        return;

    }


    showReport();


    setTimeout(
        function(){

            window.print();

        },
        400
    );

}


/* =========================
   حفظ التقرير كصورة
========================= */

function saveReportImage(){

    if(trades.length===0){

        alert(
            "⚠️ لا توجد صفقات لإصدار التقرير"
        );

        return;

    }


    showReport();


    const report =
    document.getElementById("report");


    setTimeout(
    function(){

        html2canvas(
            report,
            {
                scale:2,
                backgroundColor:"#ffffff",
                useCORS:true
            }
        )
        .then(
        function(canvas){

            const link =
            document.createElement("a");


            const date =
            new Date()
            .toISOString()
            .slice(0,10);


            link.download =
            "تقرير-الأوبشن-" +
            date +
            ".png";


            link.href =
            canvas.toDataURL(
                "image/png"
            );


            link.click();

        })
        .catch(
        function(){

            alert(
                "حدث خطأ أثناء إنشاء الصورة"
            );

        });

    },
    400
    );

}


/* =========================
   تشغيل أولي
========================= */

displayTrades();

</script>

</body>
</html>
