body.silver{

body.midnight{

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    background:var(--bg);
    color:var(--text);
    font-family:Arial,Tahoma,sans-serif;
}

.container{
    max-width:1150px;
    margin:auto;
}

/* =========================
   البنر الأسود والشعار
========================= */

.main-banner,
.report-banner{

    width:100%;

    height:180px;

    background:#000;

    border-radius:18px;

    display:flex;

    justify-content:center;

    align-items:center;

    overflow:hidden;

    margin-bottom:12px;
}

.main-banner img,
.report-banner img{

    width:165px;

    height:165px;

    object-fit:contain;

    display:block;
}

h1{
    text-align:center;
    margin:8px 0 20px;
    font-size:32px;
}

/* =========================
   الأزرار
========================= */

button,
input,
select{
    font-family:inherit;
}

.theme-button,
.report-button,
.history-button{

    display:block;

    margin:0 auto 12px;

    padding:12px 22px;

    background:var(--button);

    color:var(--buttonText);

    border:0;

    border-radius:11px;

    cursor:pointer;

    font-size:15px;

    font-weight:bold;
}

.theme-menu{

    display:none;

    background:var(--card);

    border:1px solid var(--border);

    border-radius:16px;

    padding:15px;

    margin-bottom:20px;

    gap:10px;
}

.theme-menu.show{

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(130px,1fr));
}

.theme-menu button{

    padding:12px;

    border:1px solid var(--border);

    border-radius:10px;

    background:var(--card);

    color:var(--text);

    cursor:pointer;
}

/* =========================
   الصناديق
========================= */

.form-box,
.table-box,
.report-filter,
.report,
.history-box{

    background:var(--card);

    border:1px solid var(--border);

    border-radius:16px;

    padding:20px;
}

.form{

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(150px,1fr));

    gap:12px;
}

.field{

    display:flex;

    flex-direction:column;

    gap:6px;
}

.field label{

    font-size:13px;

    font-weight:bold;

    color:var(--secondary);
}

input,
select{

    width:100%;

    padding:12px;

    border:1px solid var(--border);

    border-radius:9px;

    background:var(--card);

    color:var(--text);

    font-size:15px;
}

.add-button{

    width:100%;

    margin-top:16px;

    padding:14px;

    background:var(--button);

    color:var(--buttonText);

    border:0;

    border-radius:10px;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;
}

/* =========================
   الجدول الرئيسي
========================= */

.table-box{

    margin-top:20px;

    overflow-x:auto;
}

table{

    width:100%;

    min-width:1050px;

    border-collapse:collapse;
}

th{

    background:var(--header);

    padding:13px;
}

td{

    padding:12px;

    text-align:center;

    border-bottom:1px solid var(--border);
}

.green{
    color:#13894e;
    font-weight:bold;
}

.orange{

    font-weight:bold;
}

.red{

.delete-button{

}

.empty{

/* =========================
   التقرير
========================= */

.report-filter{

    margin-top:20px;
}

.report-filter h3{

    text-align:center;
}

.filter-grid{

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(160px,1fr));

    gap:10px;
}

.filter-button{

    padding:11px;

    border:0;

    border-radius:9px;

    background:var(--header);

    color:var(--text);

    cursor:pointer;

    font-weight:bold;
}

.filter-button.active{

    background:var(--button);

    color:var(--buttonText);
}

.report{

    display:none;

.report.show{

}

.report h2{

}

.report-period{

}

.stats{

.stat{

}

.report-table{

.report-table table{

.report-table th{

}

.report-table td{

    color:#222;

.win-row td{

.stopped-row td{

    color:#00788c;
}

.loss-row td{

    background:#ffe1e1;

.report-actions{

.report-action{

/* =========================

========================= */

.history-box{

.history-box.show{

.history-title{

.history-item{

    }
}

<script>

/* =====================================================
   التخزين
===================================================== */

let trades=[];

let reports=[];


try{

    trades=JSON.parse(
        localStorage.getItem("optionTrades") || "[]"
    );

    if(!Array.isArray(trades)){
        trades=[];
    }

}catch(e){

    trades=[];

}


try{

    reports=JSON.parse(
        localStorage.getItem("optionReports") || "[]"
    );

    if(!Array.isArray(reports)){
        reports=[];
    }

}catch(e){

    reports=[];

}


/* =====================================================
   الثيم
===================================================== */

function toggleThemes(){

    document
    .getElementById("themeMenu")
    .classList
    .toggle("show");

}


function setTheme(theme){

    document.body.className=theme;

    localStorage.setItem(
        "optionTheme",
        theme
    );

    document
    .getElementById("themeMenu")
    .classList
    .remove("show");

}


const savedTheme=
localStorage.getItem("optionTheme");

if(savedTheme!==null){

    document.body.className=savedTheme;

}


/* =====================================================
   أرشيف التقارير
===================================================== */

function toggleHistory(){

    document
    .getElementById("historyBox")
    .classList
    .toggle("show");

    displayHistory();

}


function saveReports(){

    localStorage.setItem(
        "optionReports",
        JSON.stringify(reports)
    );

}


function displayHistory(){

    const list=
    document.getElementById("historyList");

    list.innerHTML="";


    if(reports.length===0){

        list.innerHTML=`

        <div class="no-history">

        لا توجد تقارير محفوظة حتى الآن

        </div>

        `;

        return;
    }


    reports
    .slice()
    .reverse()
    .forEach(function(report,index){

        const realIndex=
        reports.length-1-index;


        const total=
        report.trades
        ?
        report.trades.length
        :
        0;


        list.innerHTML+=`

        <div class="history-item">

        <div class="history-info">

        📅 من
        ${formatDate(report.start)}

        إلى
        ${formatDate(report.end)}

        <br>

        📊 عدد الصفقات:
        ${total}

        </div>


        <div class="history-actions">

        <button
        onclick="openSavedReport(${realIndex})">

        👁️ فتح

        </button>


        <button
        onclick="deleteSavedReport(${realIndex})">

        🗑️ حذف

        </button>

        </div>

        </div>

        `;

    });

}


function deleteSavedReport(index){

    if(
        !confirm(
            "هل تريدين حذف هذا التقرير نهائيًا؟"
        )
    ){

        return;

    }


    reports.splice(index,1);

    saveReports();

    displayHistory();

}


function openSavedReport(index){

    const saved=
    reports[index];

    if(!saved){

        return;
    }


    renderReport(
        saved.trades || [],
        saved.start,
        saved.end
    );


    document
    .getElementById("report")
    .classList
    .add("show");


    document
    .getElementById("report")
    .scrollIntoView({
        behavior:"smooth",
        block:"start"
    });

}


/* =====================================================
   التاريخ
===================================================== */

function formatDate(date){

    if(!date){

        return "-";
    }


    const parts=date.split("-");


    if(parts.length!==3){

        return date;
    }


    return(
        parts[2]+
        "/"+
        parts[1]+
        "/"+
        parts[0]
    );

}


function toInputDate(date){

    const y=date.getFullYear();

    const m=String(
        date.getMonth()+1
    ).padStart(2,"0");

    const d=String(
        date.getDate()
    ).padStart(2,"0");


    return(
        y+
        "-"+
        m+
        "-"+
        d
    );

}


/* =====================================================
   إضافة الصفقة
===================================================== */

function addTrade(){

    const stock=
    document
    .getElementById("stock")
    .value
    .trim();


    const option=
    document
    .getElementById("option")
    .value;


    const strike=
    parseFloat(
        document
        .getElementById("strike")
        .value
    );


    const buy=
    parseFloat(
        document
        .getElementById("buy")
        .value
    );


    const sell=
    parseFloat(
        document
        .getElementById("sell")
        .value
    );


    const startDate=
    document
    .getElementById("startDate")
    .value;


    const endDate=
    document
    .getElementById("endDate")
    .value;


    if(
        !stock ||
        !option ||
        isNaN(strike) ||
        isNaN(buy) ||
        isNaN(sell) ||
        !startDate ||
        !endDate
    ){

        alert(
            "⚠️ فضلاً أدخل جميع بيانات الصفقة والتواريخ"
        );

        return;
    }


    if(endDate<startDate){

        alert(
            "⚠️ تاريخ النهاية يجب أن يكون بعد تاريخ البداية"
        );

        return;
    }


    if(buy<=0){

        alert(
            "⚠️ سعر الشراء يجب أن يكون أكبر من صفر"
        );

        return;
    }


    const profit=sell-buy;

    const percentage=
    (profit/buy)*100;


    trades.push({

        id:Date.now(),

        stock:
        stock.toUpperCase(),

        option,

        strike,

        buy,

        sell,

        startDate,

        endDate,

        profit,

        percentage

    });


    saveTrades();

    displayTrades();

    clearForm();

}


/* =====================================================
   تنظيف الصفحة
===================================================== */

function clearForm(){

    document
    .getElementById("stock")
    .value="";


    document
    .getElementById("option")
    .value="";


    document
    .getElementById("strike")
    .value="";


    document
    .getElementById("buy")
    .value="";


    document
    .getElementById("sell")
    .value="";


    document
    .getElementById("startDate")
    .value="";


    document
    .getElementById("endDate")

/* =====================================================
   حفظ الصفقات الحالية
===================================================== */

function saveTrades(){

    localStorage.setItem(
        "optionTrades",
        JSON.stringify(trades)
    );

}


/* =====================================================
   حالة الصفقة
===================================================== */

function getStatus(trade){

    if(Number(trade.sell)===0){

        return{

            name:"خاسرة",

            rowClass:"loss-row",

            textClass:"red"

        };

    }


    if(
        Number(trade.sell)
        <
        Number(trade.buy)
        &&
        Number(trade.sell)>0
    ){

        return{

            name:"موقوفة",

            rowClass:"stopped-row",

            textClass:"orange"

        };

    }


    return{

        name:"رابحة",

        rowClass:"win-row",

        textClass:"green"

    };

}


/* =====================================================
   حماية النص
===================================================== */

function escapeHTML(value){

    return String(value)

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}


/* =====================================================
   عرض الصفقات الحالية
===================================================== */

function displayTrades(){

    const body=
    document
    .getElementById("tableBody");

    body.innerHTML="";


    if(trades.length===0){

        body.innerHTML=`

        </td>

        </td>

        </td>

        <td>
        ${Number(t.buy).toFixed(2)}
        </td>

        <td>

        </td>

        <td>
        ${formatDate(t.startDate)}
        </td>

        ${formatDate(t.endDate)}

/* =====================================================
   حذف
===================================================== */

function deleteTrade(index){

    if(
        !confirm(
            "هل تريد حذف هذه الصفقة؟"
        )
    ){

        return;
    }


    trades.splice(index,1);

    saveTrades();

    displayTrades();

}


/* =====================================================
   فترات التقرير
===================================================== */

function getWeekRange(offset){

    const now=new Date();

    now.setHours(0,0,0,0);


    const day=now.getDay();

    const diff=
    day===0
    ?6
    :day-1;


    const monday=
    new Date(now);


    monday.setDate(
        now.getDate()-
        diff+
        offset*7
    );


    const sunday=
    new Date(monday);


    sunday.setDate(
        monday.getDate()+6
    );


    return{

        start:
        toInputDate(monday),

        end:
        toInputDate(sunday)

    };

}


function getMonthRange(offset){

    const now=new Date();


    const first=
    new Date(
        now.getFullYear(),
        now.getMonth()+offset,
        1
    );


    const last=
    new Date(
        now.getFullYear(),
        now.getMonth()+offset+1,
        0
    );


    return{

        start:
        toInputDate(first),

        end:
        toInputDate(last)

    };

}


function setReportPeriod(
    type,
    button
){

    document
    .querySelectorAll(".filter-button")
    .forEach(function(b){

        b.classList.remove("active");

    });


    if(button){

        button.classList.add("active");

    }


    let range;


    if(type==="thisWeek"){

        range=
        getWeekRange(0);

    }

    else if(type==="lastWeek"){

        range=
        getWeekRange(-1);

    }

    else if(type==="thisMonth"){

        range=
        getMonthRange(0);

    }

    else if(type==="lastMonth"){

        range=
        getMonthRange(-1);

    }

    else{

        document
        .getElementById("reportStart")
        .value="";

        document
        .getElementById("reportEnd")
        .value="";

        return;
    }


    document
    .getElementById("reportStart")
    .value=
    range.start;


    document
    .getElementById("reportEnd")
    .value=
    range.end;

}


/* =====================================================
   فلترة
===================================================== */

function getFilteredTrades(){

    const start=
    document
    .getElementById("reportStart")
    .value;


    const end=
    document
    .getElementById("reportEnd")
    .value;


    if(!start&&!end){

        return trades;
    }


    return trades.filter(
    function(t){

        return(

            (t.startDate||"")<=end

            &&

            (t.endDate||"")>=start

        );

    });

}


/* =====================================================
   إصدار التقرير
===================================================== */

function showReport(){

    const start=
    document
    .getElementById("reportStart")
    .value;


    const end=
    document
    .getElementById("reportEnd")
    .value;


    if(!start||!end){

        alert(
            "⚠️ اختاري فترة التقرير أولاً"
        );

        return;
    }


    if(end<start){

        alert(
            "⚠️ تاريخ نهاية التقرير غير صحيح"
        );

        return;
    }


    const filtered=
    getFilteredTrades();


    if(filtered.length===0){

        alert(
            "⚠️ لا توجد صفقات في هذه الفترة"
        );

        return;
    }


    /*
       مهم:
       نحفظ نسخة مستقلة من التقرير
       قبل تصفير الصفحة.
    */

    const reportCopy=
    JSON.parse(
        JSON.stringify(filtered)
    );


    const alreadyExists=
    reports.some(
    function(r){

        return(
            r.start===start &&
            r.end===end
        );

    });


    if(alreadyExists){

        const replace=
        confirm(
            "يوجد تقرير محفوظ لنفس الفترة.\n\nهل تريدين استبداله بالتقرير الجديد؟"
        );


        if(!replace){

            return;
        }


        reports=
        reports.filter(
        function(r){

            return!(
                r.start===start &&
                r.end===end
            );

        });

    }


    reports.push({

        id:Date.now(),

        start:start,

        end:end,

        createdAt:
        new Date().toISOString(),

        trades:reportCopy

    });


    saveReports();


    /*
       نعرض التقرير أولاً
    */

    renderReport(
        reportCopy,
        start,
        end
    );


    document
    .getElementById("report")
    .classList
    .add("show");


    /*
       ثم نصفر الصفحة الرئيسية
    */

    trades=[];

    saveTrades();

    displayTrades();

    clearForm();


    /*
       تنظيف اختيار التقرير
    */

    document
    .getElementById("reportStart")
    .value="";


    document
    .getElementById("reportEnd")
    .value="";


    document
    .querySelectorAll(".filter-button")
    .forEach(function(b){

        b.classList.remove("active");

    });


    displayHistory();


    alert(
        "✅ تم حفظ التقرير في التقارير السابقة وتصفير الصفحة لبدء أسبوع جديد."
    );


    document
    .getElementById("report")
    .scrollIntoView({

        behavior:"smooth",

        block:"start"

    });

}


/* =====================================================
   رسم التقرير
===================================================== */

function renderReport(
    filtered,
    start,
    end
){

    const total=
    filtered.length;


    const winners=
    filtered.filter(
        t=>
        Number(t.sell)>
        Number(t.buy)
    ).length;


    const stopped=
    filtered.filter(
        t=>
        Number(t.sell)<
        Number(t.buy)
        &&
        Number(t.sell)>0
    ).length;


    const losers=
    filtered.filter(
        t=>
        Number(t.sell)===0
    ).length;


    const net=
    filtered.reduce(
        (sum,t)=>
        sum+
        Number(t.profit||0),
        0
    );


    const average=
    total
    ?
    filtered.reduce(
        (sum,t)=>
        sum+
        Number(t.percentage||0),
        0
    )/total
    :
    0;


    document
    .getElementById("totalTrades")
    .textContent=total;


    document
    .getElementById("winningTrades")
    .textContent=winners;


    document
    .getElementById("stoppedTrades")
    .textContent=stopped;


    document
    .getElementById("losingTrades")
    .textContent=losers;


    const netElement=
    document
    .getElementById("netProfit");


    netElement.textContent=
    (net>=0?"+":"")+
    net.toFixed(2);


    netElement.className=
    net>=0
    ?"green"
    :"red";


    document
    .getElementById("averagePercent")
    .textContent=
    (average>=0?"+":"")+
    average.toFixed(2)+
    "%";


    document
    .getElementById("reportPeriod")
    .textContent=
    "من "+
    formatDate(start)+
    " إلى "+
    formatDate(end);


    let html=`

    <table>

    <thead>

    <tr>

    <th>السهم</th>

    <th>الأوبشن</th>

    <th>السترايك</th>

    <th>الشراء</th>

    <th>البيع</th>

    <th>البداية</th>

    <th>النهاية</th>

    <th>الربح</th>

    <th>%</th>

    <th>الحالة</th>

    </tr>

    </thead>

    <tbody>

    `;


    if(filtered.length===0){

        html+=`

        <tr>

        <td
        colspan="10"
        style="
        padding:30px;
        text-align:center">

        لا توجد صفقات في هذه الفترة

        </td>

        </tr>

        `;

    }


    filtered.forEach(
    function(t){

        const status=
        getStatus(t);


        html+=`

        <tr
        class="${status.rowClass}">

        <td>
        ${escapeHTML(t.stock)}
        </td>

        <td>
        ${escapeHTML(t.option)}
        </td>

        <td>
        ${Number(t.strike).toFixed(2)}
        </td>

        <td>
        ${Number(t.buy).toFixed(2)}
        </td>

        <td>
        ${Number(t.sell).toFixed(2)}
        </td>

        <td>
        ${formatDate(t.startDate)}
        </td>

        <td>
        ${formatDate(t.endDate)}
        </td>

        <td>

        ${
            t.profit>=0
            ?"+"
            :""
        }${Number(t.profit).toFixed(2)}

        </td>

        <td>

        ${
            t.percentage>=0
            ?"+"
            :""
        }${Number(t.percentage).toFixed(2)}%

        </td>

        <td>
        ${status.name}
        </td>

        </tr>

        `;

    });


    html+=`

    </tbody>

    </table>

    `;


    document
    .getElementById("reportTable")
    .innerHTML=html;

}

        return;
    }


    window.print();

}
