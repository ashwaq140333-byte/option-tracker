<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>متابعة الأوبشن</title>

<style>

/* =========================
   الثيم الأساسي
========================= */

:root{
    --bg:#f7f9fa;
    --card:#ffffff;
    --text:#202427;
    --secondary:#778187;
    --border:#e2e7e9;
    --button:#222a2d;
    --buttonText:#ffffff;
    --header:#eef2f3;
}


/* =========================
   الثيمات الفاتحة
========================= */

body.turquoise{
    --bg:#f2fbfb;
    --card:#ffffff;
    --text:#183034;
    --secondary:#6f8589;
    --border:#d7eeee;
    --button:#159ca5;
    --buttonText:#ffffff;
    --header:#e4f5f6;
}

body.mint{
    --bg:#f3faf6;
    --card:#ffffff;
    --text:#20332a;
    --secondary:#71847a;
    --border:#dcece3;
    --button:#3b9b70;
    --buttonText:#ffffff;
    --header:#e7f5ed;
}

body.pink{
    --bg:#fff6f9;
    --card:#ffffff;
    --text:#38252c;
    --secondary:#907781;
    --border:#f0dfe5;
    --button:#d87899;
    --buttonText:#ffffff;
    --header:#faeaf0;
}

body.lavender{
    --bg:#f8f6fc;
    --card:#ffffff;
    --text:#30283a;
    --secondary:#81758e;
    --border:#e7e0ef;
    --button:#8965b5;
    --buttonText:#ffffff;
    --header:#eee8f5;
}

body.silver{
    --bg:#f4f5f6;
    --card:#ffffff;
    --text:#292d31;
    --secondary:#747b82;
    --border:#dfe2e5;
    --button:#68727a;
    --buttonText:#ffffff;
    --header:#e9ecee;
}


/* =========================
   الثيمات الغامقة
========================= */

body.midnight{
    --bg:#0b0d12;
    --card:#151922;
    --text:#f3f5f7;
    --secondary:#9ba3ad;
    --border:#292e38;
    --button:#d4af37;
    --buttonText:#111111;
    --header:#202631;
}

body.navy{
    --bg:#07111f;
    --card:#0e1b2d;
    --text:#edf6ff;
    --secondary:#8da3b8;
    --border:#1b3450;
    --button:#398bd5;
    --buttonText:#ffffff;
    --header:#142a42;
}

body.emerald{
    --bg:#06150f;
    --card:#0d2118;
    --text:#e9fff2;
    --secondary:#8fac9b;
    --border:#1b4932;
    --button:#24a866;
    --buttonText:#ffffff;
    --header:#153725;
}

body.darkpurple{
    --bg:#10091a;
    --card:#1c1029;
    --text:#f8efff;
    --secondary:#b5a4c1;
    --border:#3b2450;
    --button:#9656d8;
    --buttonText:#ffffff;
    --header:#2b173d;
}


/* =========================
   الصفحة
========================= */

body{
    font-family:Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    margin:0;
    padding:20px;
}

.container{
    max-width:1100px;
    margin:auto;
}

.logo{
    width:70px;
    height:70px;
    object-fit:contain;
    display:block;
    margin:0 auto 8px;
}

h1{
    text-align:center;
    margin-bottom:20px;
}


/* =========================
   الثيمات
========================= */

.theme-button,
.report-button{

    display:block;
    margin:0 auto 10px;
    padding:11px 20px;
    background:var(--button);
    color:var(--buttonText);
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:15px;

}

.theme-menu{

    display:none;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:15px;
    padding:15px;
    margin-bottom:20px;
    gap:10px;

}

.theme-menu.show{

    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(130px,1fr));

}

.theme-menu button{

    padding:12px;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--card);
    color:var(--text);
    cursor:pointer;

}


/* =========================
   نموذج الصفقة
========================= */

.form-box{

    background:var(--card);
    padding:20px;
    border-radius:15px;
    border:1px solid var(--border);
    box-shadow:0 3px 15px #00000018;

}

.form{

    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(150px,1fr));
    gap:10px;

}

input,
select{

    width:100%;
    padding:12px;
    border:1px solid var(--border);
    border-radius:8px;
    font-size:15px;
    box-sizing:border-box;
    background:var(--card);
    color:var(--text);

}

.add-button{

    margin-top:15px;
    width:100%;
    padding:13px;
    background:var(--button);
    color:var(--buttonText);
    border:none;
    border-radius:9px;
    font-size:16px;
    cursor:pointer;

}


/* =========================
   جدول الصفقات
========================= */

.table-box{

    margin-top:20px;
    background:var(--card);
    padding:15px;
    border-radius:15px;
    border:1px solid var(--border);
    overflow-x:auto;

}

table{

    width:100%;
    min-width:850px;
    border-collapse:collapse;

}

th{

    background:var(--header);
    color:var(--text);
    padding:13px;

}

td{

    padding:12px;
    text-align:center;
    border-bottom:
    1px solid var(--border);

}

.green{
    color:#168a52;
    font-weight:bold;
}

.orange{
    color:#008ca3;
    font-weight:bold;
}

.red{
    color:#d93030;
    font-weight:bold;
}

.delete-button{

    background:#d93636;
    color:#ffffff;
    border:none;
    border-radius:7px;
    padding:7px 12px;
    cursor:pointer;

}

.empty{

    text-align:center;
    color:var(--secondary);
    padding:25px;

}


/* =========================
   التقرير
========================= */

.report{

    display:none;
    background:#ffffff !important;
    color:#222222 !important;
    border:1px solid #dddddd;
    border-radius:15px;
    padding:20px;
    margin-top:20px;

}

.report.show{
    display:block;
}

.report h2{

    text-align:center;
    color:#222222 !important;

}

.report-date{

    text-align:center;
    color:#666666 !important;
    margin-bottom:20px;

}

.stats{

    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(140px,1fr));
    gap:10px;
    margin:20px 0;

}

.stat{

    background:#f4f4f4 !important;
    color:#222222 !important;
    padding:15px;
    border-radius:10px;
    text-align:center;

}

.stat strong{

    display:block;
    font-size:20px;
    margin-top:7px;

}

.report-table{

    background:#ffffff !important;
    color:#222222 !important;
    overflow-x:auto;

}

.report-table table{

    width:100%;
    min-width:850px;
    border-collapse:collapse;
    background:#ffffff !important;

}

.report-table th{

    background:#eeeeee !important;
    color:#222222 !important;
    border:1px solid #d5d5d5;
    padding:12px;

}

.report-table td{

    border:1px solid #d5d5d5;
    padding:11px;
    color:#222222 !important;

}

.report-table tr.win-row td{

    background:#dff5e7 !important;
    color:#126b3d !important;

}

.report-table tr.stopped-row td{

    background:#dff7fb !important;
    color:#00788c !important;

}

.report-table tr.loss-row td{

    background:#ffe1e1 !important;
    color:#b52222 !important;

}

.report-actions{

    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;

}

.report-action{

    background:#222222;
    color:#ffffff;
    border:none;
    border-radius:9px;
    padding:12px 18px;
    cursor:pointer;
    font-size:15px;

}


/* =========================
   PDF
========================= */

@media print{

    body{
        background:#ffffff !important;
    }

    .no-print{
        display:none !important;
    }

    .report{
        display:block !important;
        border:none !important;
        box-shadow:none !important;
    }

}

</style>

</head>


<body>


<div class="container">


<img
src="./IMG_6426.jpeg"
class="logo"
alt="شعار البرنامج"
>


<h1>
متابعة الأوبشن
</h1>


<!-- الثيمات -->

<div class="no-print">

<button
class="theme-button"
onclick="toggleThemes()"
>
🎨 الثيمات
</button>


<div
id="themeMenu"
class="theme-menu"
>

<button onclick="setTheme('')">
🤍 Pure White
</button>

<button onclick="setTheme('turquoise')">
🩵 Ice Turquoise
</button>

<button onclick="setTheme('mint')">
🌿 Mint
</button>

<button onclick="setTheme('pink')">
🩷 Soft Pink
</button>

<button onclick="setTheme('lavender')">
💜 Lavender
</button>

<button onclick="setTheme('silver')">
🩶 Silver
</button>

<button onclick="setTheme('midnight')">
🖤 Midnight
</button>

<button onclick="setTheme('navy')">
🌌 Deep Navy
</button>

<button onclick="setTheme('emerald')">
🟢 Dark Emerald
</button>

<button onclick="setTheme('darkpurple')">
🟣 Dark Purple
</button>

</div>

</div>


<!-- إضافة صفقة -->

<div class="form-box no-print">

<div class="form">

<input
id="stock"
type="text"
placeholder="السهم"
>

<select id="option">

<option value="">
اختر الأوبشن
</option>

<option value="Call">
Call 📈
</option>

<option value="Put">
Put 📉
</option>

</select>

<input
id="strike"
type="number"
step="0.01"
placeholder="السترايك"
>

<input
id="buy"
type="number"
step="0.01"
placeholder="سعر الشراء"
>

<input
id="sell"
type="number"
step="0.01"
placeholder="سعر البيع"
>

<button
class="add-button"
onclick="addTrade()"
>
➕ إضافة الصفقة
</button>

</div>


<!-- جدول الصفقات -->

<div class="table-box">

<table>

<thead>

<tr>

<th>السهم</th>
<th>الأوبشن</th>
<th>السترايك</th>
<th>سعر الشراء</th>
<th>سعر البيع</th>
<th>الربح</th>
<th>الأرباح %</th>
<th class="no-print">حذف</th>

</tr>

</thead>


<tbody id="tableBody">

<tr>

<td
colspan="8"
class="empty"
>
لا توجد صفقات حتى الآن
</td>

</tr>

</tbody>

</table>

</div>


<!-- إصدار التقرير -->

<div class="no-print">

<button
class="report-button"
onclick="showReport()"
>
📄 إصدار تقرير
</button>

</div>


<!-- التقرير -->

<div
id="report"
class="report"
>

<h2>
📊 تقرير صفقات الأوبشن
</h2>

<div
id="reportDate"
class="report-date"
>
</div>


<div class="stats">


<div class="stat">

إجمالي الصفقات

<strong id="totalTrades">
0
</strong>

</div>


<div class="stat">

🟢 الرابحة

<strong
id="winningTrades"
class="green"
>
0
</strong>

</div>


<div class="stat">

🩵 الموقوفة

<strong
id="stoppedTrades"
class="orange"
>
0
</strong>

</div>


<div class="stat">

🔴 الخاسرة

<strong
id="losingTrades"
class="red"
>
0
</strong>

</div>


<div class="stat">

صافي الربح / الخسارة

0.00
</strong>

</div>

متوسط الربح %

0.00%
</strong>

</div>


<div class="report-actions no-print">

<button
class="report-action"
onclick="printReport()"
>
📄 PDF

🖼️ صورة
</button>

</div>

>

</div>


<script>

/* =========================
   البيانات
========================= */

let trades =
JSON.parse(
localStorage.getItem("optionTrades") || "[]"
);


/* =========================
   الثيمات
========================= */

function toggleThemes(){

    document
    .getElementById("themeMenu")
    .classList
    .toggle("show");

}


function setTheme(theme){

    document.body.className = theme;

    localStorage.setItem(
        "optionTheme",
        theme
    );

    document
    .getElementById("themeMenu")
    .classList
    .remove("show");

}


const savedTheme =
localStorage.getItem("optionTheme");


if(savedTheme !== null){

    document.body.className =
    savedTheme;

}


/* =========================
   إضافة صفقة
========================= */

function addTrade(){

    const stock =
    document.getElementById("stock")
    .value.trim();

    const option =
    document.getElementById("option")
    .value;

    const strike =
    parseFloat(
        document.getElementById("strike")
        .value
    );

    const buy =
    parseFloat(
        document.getElementById("buy")
        .value
    );

    const sell =
    parseFloat(
        document.getElementById("sell")
        .value
    );


    if(
        stock === "" ||
        option === "" ||
        isNaN(strike) ||
        isNaN(buy) ||
        isNaN(sell)
    ){

        alert(
            "⚠️ فضلاً أدخل جميع البيانات"
        );

        return;

    }


    if(buy <= 0){

        alert(
            "⚠️ سعر الشراء يجب أن يكون أكبر من صفر"
        );

        return;

    }


    const profit =
    sell - buy;


    const percentage =
    (profit / buy) * 100;


    trades.push({

        stock,
        option,
        strike,
        buy,
        sell,
        profit,
        percentage

    });


    saveTrades();

    displayTrades();


    document.getElementById("stock").value="";
    document.getElementById("option").value="";
    document.getElementById("strike").value="";
    document.getElementById("buy").value="";
    document.getElementById("sell").value="";

}


/* =========================
   الحفظ
========================= */

function saveTrades(){

    localStorage.setItem(
        "optionTrades",
        JSON.stringify(trades)
    );

}


/* =========================
   حالة الصفقة
========================= */

function getStatus(trade){

    if(trade.sell === 0){

        return {

            name:"خاسرة",
            rowClass:"loss-row",
            textClass:"red"

        };

    }


    if(
        trade.sell < trade.buy &&
        trade.sell > 0
    ){

        return {

            name:"موقوفة",
            rowClass:"stopped-row",
            textClass:"orange"

        };

    }


    return {

        name:"رابحة",
        rowClass:"win-row",
        textClass:"green"

    };

}


/* =========================
   عرض الصفقات
========================= */

function displayTrades(){

    const body =
    document.getElementById("tableBody");


    body.innerHTML="";


    if(trades.length===0){

        body.innerHTML=`

        <tr>

        <td
        colspan="8"
        class="empty"
        >

        لا توجد صفقات حتى الآن

        </td>

        </tr>

        `;

        return;

    }


    trades.forEach(

    function(t,index){

        const status =
        getStatus(t);


        body.innerHTML += `

        <tr>

        <td>${t.stock}</td>

        <td>${t.option}</td>

        <td>${t.strike.toFixed(2)}</td>

        <td>${t.buy.toFixed(2)}</td>

        <td>${t.sell.toFixed(2)}</td>

        <td class="${status.textClass}">

        ${t.profit >= 0 ? "+" : ""}
        ${t.profit.toFixed(2)}

        </td>

        <td class="${status.textClass}">

        ${t.percentage >= 0 ? "+" : ""}
        ${t.percentage.toFixed(2)}%

        </td>

        <td class="no-print">

        <button
        class="delete-button"
        onclick="deleteTrade(${index})"
        >

        حذف

        </button>

        </td>

        </tr>

        `;

    });

}


/* =========================
   حذف
========================= */

function deleteTrade(index){

    trades.splice(index,1);

    saveTrades();

    displayTrades();

}


/* =========================
   التقرير
========================= */

function showReport(){

    const report =
    document.getElementById("report");


    report.classList.add("show");


    const total =
    trades.length;


    const winners =
    trades.filter(
        t => t.sell > t.buy
    ).length;


    const stopped =
    trades.filter(
        t =>
        t.sell < t.buy &&
        t.sell > 0
    ).length;


    const losers =
    trades.filter(
        t => t.sell === 0
    ).length;


    const net =
    trades.reduce(
        (sum,t) =>
        sum + t.profit,
        0
    );


    const average =
    total
    ?
    trades.reduce(
        (sum,t) =>
        sum + t.percentage,
        0
    ) / total
    :
    0;


    document
    .getElementById("totalTrades")
    .textContent=total;


    document
    .getElementById("winningTrades")
    .textContent=winners;


    document
    .getElementById("stoppedTrades")
    .textContent=stopped;


    document
    .getElementById("losingTrades")
    .textContent=losers;


    const netElement =
    document.getElementById("netProfit");


    netElement.textContent =
    (net >= 0 ? "+" : "") +
    net.toFixed(2);


    netElement.className =
    net >= 0
    ? "green"
    : "red";


    document
    .getElementById("averagePercent")
    .textContent =
    (average >= 0 ? "+" : "") +
    average.toFixed(2) +
    "%";


    document
    .getElementById("reportDate")
    .textContent =
    "تاريخ التقرير: " +
    new Date()
    .toLocaleDateString("ar-SA");


    let html=`

    <table>

    <thead>

    <tr>

    <th>السهم</th>
    <th>الأوبشن</th>
    <th>السترايك</th>
    <th>الشراء</th>
    <th>البيع</th>
    <th>الربح</th>
    <th>%</th>
    <th>الحالة</th>

    </tr>

    </thead>

    <tbody>

    `;


    trades.forEach(function(t){

        const status =
        getStatus(t);


        html += `

        <tr class="${status.rowClass}">

        <td>${t.stock}</td>

        <td>${t.option}</td>

        <td>${t.strike.toFixed(2)}</td>

        <td>${t.buy.toFixed(2)}</td>

        <td>${t.sell.toFixed(2)}</td>

        <td>

        ${t.profit >= 0 ? "+" : ""}
        ${t.profit.toFixed(2)}

        </td>

        <td>

        ${t.percentage >= 0 ? "+" : ""}
        ${t.percentage.toFixed(2)}%

        </td>

        <td>

        ${status.name}

        </td>

        </tr>

        `;

    });


    html += `

    </tbody>

    </table>

    `;


    document
    .getElementById("reportTable")
    .innerHTML=html;

}


/* =========================
   PDF
========================= */

function printReport(){

    if(trades.length===0){

        alert(
            "⚠️ لا توجد صفقات لإصدار التقرير"
        );

        return;

    }


    showReport();


    setTimeout(
        function(){

            window.print();

        },
        500
    );

}


/* =========================
   إنشاء صورة التقرير
   بدون html2canvas
========================= */

function saveReportImage(){

    if(trades.length === 0){

        alert(
            "⚠️ لا توجد صفقات لإصدار التقرير"
        );

        return;

    }


    const canvas =
    document.createElement("canvas");


    const ctx =
    canvas.getContext("2d");


    const width = 1200;


    const rowHeight = 60;


    const headerHeight = 80;


    const titleHeight = 110;


    const totalHeight =
    titleHeight +
    headerHeight +
    ((trades.length + 1) * rowHeight) +
    80;


    canvas.width = width;

    canvas.height = totalHeight;


    /* الخلفية */

    ctx.fillStyle =
    "#ffffff";

    ctx.fillRect(
        0,
        0,
        width,
        totalHeight
    );


    /* العنوان */

    ctx.fillStyle =
    "#222222";

    ctx.font =
    "bold 34px Arial";

    ctx.textAlign =
    "center";


    ctx.fillText(
        "تقرير صفقات الأوبشن",
        width / 2,
        50
    );


    ctx.font =
    "20px Arial";


    ctx.fillStyle =
    "#666666";


    ctx.fillText(

        "تاريخ التقرير: " +

        new Date()
        .toLocaleDateString("ar-SA"),

        width / 2,
        85

    );


    /* الأعمدة */

    const columns = [

        "السهم",
        "الأوبشن",
        "السترايك",
        "الشراء",
        "البيع",
        "الربح",
        "%",
        "الحالة"

    ];


    const columnWidth =
    width / columns.length;


    let y =
    titleHeight;


    /* رأس الجدول */

    ctx.fillStyle =
    "#eeeeee";


    ctx.fillRect(
        0,
        y,
        width,
        headerHeight
    );


    ctx.fillStyle =
    "#222222";


    ctx.font =
    "bold 20px Arial";


    columns.forEach(
    function(column,index){

        ctx.fillText(

            column,

            width -
            (index * columnWidth) -
            (columnWidth / 2),

            y + 48

        );

    });


    y += headerHeight;


    /* الصفوف */

    trades.forEach(
    function(t){

        const status =
        getStatus(t);


        if(status.name === "رابحة"){

            ctx.fillStyle =
            "#dff5e7";

        }

        else if(status.name === "موقوفة"){

            ctx.fillStyle =
            "#dff7fb";

        }

        else{

            ctx.fillStyle =
            "#ffe1e1";

        }


        ctx.fillRect(
            0,
            y,
            width,
            rowHeight
        );


        ctx.strokeStyle =
        "#d5d5d5";


        ctx.strokeRect(
            0,
            y,
            width,
            rowHeight
        );


        ctx.fillStyle =
        "#222222";


        ctx.font =
        "18px Arial";


        const values = [

            t.stock,

            t.option,

            t.strike.toFixed(2),

            t.buy.toFixed(2),

            t.sell.toFixed(2),

            (
                t.profit >= 0
                ? "+"
                : ""
            ) +
            t.profit.toFixed(2),

            (
                t.percentage >= 0
                ? "+"
                : ""
            ) +
            t.percentage.toFixed(2) +
            "%",

            status.name

        ];


        values.forEach(
        function(value,index){

            ctx.fillText(

                value,

                width -
                (index * columnWidth) -
                (columnWidth / 2),

                y + 38

            );

        });


        y += rowHeight;

    });


    /* تنزيل الصورة */

    canvas.toBlob(
    function(blob){

        if(!blob){

            alert(
                "❌ تعذر إنشاء صورة التقرير"
            );

            return;

        }


        const url =
        URL.createObjectURL(blob);


        const link =
        document.createElement("a");


        link.href =
        url;


        link.download =
        "تقرير-الأوبشن-" +
        new Date()
        .toLocaleDateString("en-CA") +
        ".png";


        document
        .body
        .appendChild(link);


        link.click();


        document
        .body
        .removeChild(link);


        setTimeout(
        function(){

            URL.revokeObjectURL(url);

        },
        1000
        );


    },
    "image/png"
    );

}


/* =========================
   تشغيل
========================= */

displayTrades();

</script>
